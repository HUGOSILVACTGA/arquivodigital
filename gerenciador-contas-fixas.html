<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contas Fixas · Hillo</title>
<style>
:root{
  --b950:#071a47;--b900:#0b2a6f;--b800:#123a96;--b700:#1d4ed8;--b600:#2563eb;--b500:#3b82f6;--b200:#bfdbfe;--b100:#dbeafe;--b50:#eff6ff;
  --bg:#eef3fb;--card:#fff;--tx:#0f1d3d;--mut:#64748b;--line:#dbe4f3;
  --ok:#16a34a;--ok-bg:#dcfce7;--late:#dc2626;--late-bg:#fee2e2;--warn:#f59e0b;--warn-bg:#fef3c7;--fut:#3b82f6;--fut-bg:#e0ecff;--gray:#e2e8f0;
  --sh:0 6px 22px rgba(15,40,110,.09);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,#4049de 0%,#1b1e64 100%);color:#fff;display:flex;flex-direction:column;padding:20px 12px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;justify-content:flex-start;padding:2px 8px 0}
.brand img{width:150px;height:auto;display:block}
.sys{font-size:12px;color:#dfe3ff;opacity:.85;margin:10px 8px 14px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.14)}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:#e6e9ff;padding:11px 14px;border-radius:10px;cursor:pointer;text-align:left;font-weight:600;font-size:13.5px}
.nav button:hover{background:rgba(255,255,255,.09);color:#fff}
.nav button.on{background:#fff;color:#3a3bd4;font-weight:700;box-shadow:0 4px 14px rgba(10,12,70,.35)}
.nav .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;box-shadow:0 3px 8px rgba(8,10,60,.35)}
.nav .ic svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.nav .bd{margin-left:auto;background:var(--late);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
.side .ft{font-size:11px;color:#dfe3ff;background:rgba(10,12,70,.35);border-radius:12px;padding:12px 14px;margin-top:10px;line-height:1.5}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top h1{font-size:19px;color:var(--b900)}
.top .sp{flex:1}
.clock{color:var(--mut);font-size:13px}
.pillp{border:0;border-radius:99px;padding:8px 14px;font-weight:700;cursor:pointer;background:var(--ok-bg);color:#166534}
.pillp.has{background:var(--late);color:#fff;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}50%{box-shadow:0 0 0 8px rgba(220,38,38,0)}}
.usr{display:flex;align-items:center;gap:8px;font-size:13px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--b700);color:#fff;display:grid;place-items:center;font-weight:700}
#view{padding:22px 24px 30px;flex:1}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:18px;border:1px solid #e8eef9}
.btn{border:1px solid transparent;border-radius:10px;padding:9px 15px;cursor:pointer;font-weight:600;background:var(--b700);color:#fff;transition:.15s}
.btn:hover{background:var(--b800)}
.btn.ghost{background:#fff;color:var(--b800);border-color:var(--line)}
.btn.ghost:hover{background:var(--b50)}
.btn.ok{background:var(--ok)}.btn.ok:hover{background:#15803d}
.btn.danger{background:var(--late)}.btn.danger:hover{background:#b91c1c}
.btn.amber{background:var(--warn);color:#3b2a00}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--b500);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
input[type=checkbox]{width:auto}
label.f{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.span2{grid-column:span 2}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:var(--sh);border:1px solid #e8eef9;border-left:5px solid var(--b600)}
.kpi small{display:block;color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kpi b{font-size:26px;color:var(--b900)}
.kpi.ok{border-left-color:var(--ok)}.kpi.late{border-left-color:var(--late)}.kpi.warn{border-left-color:var(--warn)}.kpi.fut{border-left-color:var(--fut)}
.cal{display:flex;flex-direction:column;height:calc(100vh - 205px);min-height:560px}
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cal-head h2{font-size:24px;color:var(--b900);min-width:230px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-left:auto}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-wd div{text-align:center;font-weight:700;color:var(--b800);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.cal-grid{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:6px}
.day{background:#fff;border:1px solid var(--line);border-top:5px solid var(--gray);border-radius:12px;padding:6px 7px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;gap:3px;transition:.12s}
.day:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.day.out{background:transparent;border:0;box-shadow:none;cursor:default;transform:none}
.day.d-none{background:#f4f6fa}
.day.d-ok{border-top-color:var(--ok);background:#f4fcf6}
.day.d-late{border-top-color:var(--late);background:#fff5f5}
.day.d-warn{border-top-color:var(--warn);background:#fffbeb}
.day.d-future{border-top-color:var(--fut);background:#f3f8ff}
.day.today .dn span:first-child{background:var(--b700);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-grid;place-items:center}
.dn{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px}
.cnt{font-size:11px;background:var(--b100);color:var(--b800);border-radius:99px;padding:1px 7px}
.chip{font-size:11px;padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.c-ok{background:var(--ok-bg);color:#166534}.c-late{background:var(--late-bg);color:#991b1b}.c-warn{background:var(--warn-bg);color:#92400e}.c-future{background:var(--fut-bg);color:#1e40af}.c-cancel{background:var(--gray);color:#64748b;text-decoration:line-through}
.more{font-size:11px;color:var(--mut)}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700}
.b-ok{background:var(--ok-bg);color:#166534}.b-late{background:var(--late-bg);color:#991b1b}.b-warn{background:var(--warn-bg);color:#92400e}.b-future{background:var(--fut-bg);color:#1e40af}.b-cancel{background:var(--gray);color:#475569}
table{width:100%;border-collapse:collapse}
th{background:var(--b50);color:var(--b800);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:10px;position:sticky;top:0}
td{padding:10px;border-bottom:1px solid #edf1f8;vertical-align:middle}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--b50)}
.tw{max-height:calc(100vh - 330px);overflow:auto;border:1px solid var(--line);border-radius:12px}
.overlay{position:fixed;inset:0;background:rgba(7,26,71,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:18px;width:min(640px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .16s ease}
.modal.wide{width:min(900px,100%)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h3{flex:1;color:var(--b900);font-size:18px}
.mh .x{border:0;background:var(--b50);border-radius:8px;width:32px;height:32px;cursor:pointer;color:var(--b800)}
.mb{padding:18px 20px;overflow:auto}
.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal.alert .mh{background:linear-gradient(90deg,#b91c1c,#dc2626);border-radius:18px 18px 0 0}
.modal.alert .mh h3{color:#fff;letter-spacing:.03em}
.modal.alert .mh .x{background:rgba(255,255,255,.2);color:#fff}
.occ{border:1px solid var(--line);border-left:6px solid var(--gray);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
.occ.k-ok{border-left-color:var(--ok)}.occ.k-late{border-left-color:var(--late);background:#fff6f6}.occ.k-warn{border-left-color:var(--warn);background:#fffcf0}.occ.k-future{border-left-color:var(--fut)}
.occ h4{margin:0 0 4px;font-size:15px;color:var(--b900)}
.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--mut);font-size:12px;margin:4px 0 8px}
.meta b{color:var(--tx)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;right:20px;bottom:20px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast div{background:var(--b900);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--sh);max-width:380px;animation:pop .18s}
.toast .err{background:var(--late)}.toast .okk{background:var(--ok)}
.aumline{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;border-radius:8px;padding:6px 10px;font-size:12px;margin:0 0 8px}
.aumline.inf{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
.cmpv{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:8px 0 10px}.cmpv small{display:block;color:var(--mut);font-size:11px}.cmpv b{font-size:18px}.cmpv .arr{font-size:22px;color:var(--mut)}
.vr{display:grid;grid-template-columns:minmax(110px,1fr) 1.2fr minmax(175px,1.1fr);gap:10px;align-items:center;margin:9px 0}
.vn small,.vv small{display:block;color:var(--mut);font-size:11px}.vt{background:var(--b50);height:14px;border-radius:99px;overflow:hidden}.vb{height:100%;border-radius:99px}
.vb.late{background:linear-gradient(90deg,#f87171,#dc2626)}.vb.warn{background:linear-gradient(90deg,#fcd34d,#f59e0b)}.vb.ok{background:linear-gradient(90deg,#4ade80,#16a34a)}
.t-late{color:var(--late)}.t-warn{color:#b45309}.t-ok{color:var(--ok)}
#alertbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:250;display:none;width:min(720px,94vw)}
#alertbar.on{display:block}
#alertbar .in{background:linear-gradient(90deg,#b45309,#f59e0b);color:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 14px 40px rgba(0,0,0,.35);display:flex;gap:14px;align-items:center;animation:shake .6s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#alertbar .t{flex:1;font-weight:700}
#alertbar.ringing .in{animation:shake .6s infinite,glow 1s infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(245,158,11,.9),0 14px 40px rgba(0,0,0,.35)}to{box-shadow:0 0 0 14px rgba(245,158,11,0),0 14px 40px rgba(0,0,0,.35)}}
.auth{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,var(--b600),var(--b950) 70%);padding:20px}
.auth .box{background:#fff;border-radius:22px;padding:34px;width:min(420px,100%);box-shadow:0 30px 80px rgba(0,0,0,.4)}
.auth .brand{justify-content:center;background:linear-gradient(135deg,#4049de,#1b1e64);border-radius:14px;padding:16px;margin-bottom:12px}
.auth h2{text-align:center;color:var(--b900);margin-bottom:4px}
.auth p{text-align:center;color:var(--mut);margin:0 0 18px}
.auth .f2{margin-bottom:12px}
.err-t{color:var(--late);font-size:13px;min-height:18px;margin:6px 0}
.charts{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.charts2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart{width:100%;height:auto}
.chart .grid{stroke:#e5ecf8}.chart .axis{fill:#64748b;font-size:11px}
.card h3{font-size:15px;color:var(--b900);margin-bottom:10px}
.hb{margin:8px 0}.hb .l{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.hb .tr{height:10px;background:var(--b50);border-radius:99px;overflow:hidden}.hb .fl{height:100%;background:linear-gradient(90deg,var(--b600),var(--b500));border-radius:99px}
.leg{display:flex;flex-direction:column;gap:6px;font-size:13px}.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px}
.sec{margin-bottom:18px}.sec h3{margin-bottom:12px;color:var(--b900);font-size:16px}
.note{background:var(--b50);border:1px solid var(--b200);color:var(--b900);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.45}
.hint{color:var(--mut);font-size:12px}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0}
.pill{display:inline-block;background:var(--b100);color:var(--b800);padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.empty{text-align:center;color:var(--mut);padding:30px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.charts,.charts2{grid-template-columns:1fr}}
@media (max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.nav{flex-direction:row;flex-wrap:wrap}.grid3,.grid4{grid-template-columns:1fr 1fr}}
@media print{body{background:#fff}}
</style>

<script>
'use strict';
/* =====================  CONSTANTES  ===================== */
const TZ='America/Sao_Paulo';
const VERSAO='V.1.0';
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES3=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const DOWS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DOWL=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const FREQS={mensal:1,bimestral:2,trimestral:3,semestral:6,anual:12};
const FREQ_LABEL={mensal:'Mensal',bimestral:'Bimestral',trimestral:'Trimestral',semestral:'Semestral',anual:'Anual'};
const ST_LABEL={PENDENTE:'Pendente',RECEBIDA:'Recebida',RETIRADA:'Retirada do portal',CANCELADA:'Cancelada'};
const PERMS=[['cadastrar','Cadastrar contas'],['editar','Editar contas'],['excluir','Excluir / inativar contas'],['marcar','Marcar como recebida / retirada'],['desfazer','Desfazer marcações'],['cancelar','Cancelar ocorrências'],['anexar','Anexar comprovantes'],['historico','Ver histórico e consultas'],['relatorios','Exportar relatórios'],['auditoria','Ver auditoria'],['config','Configurar alertas e regras'],['backup','Backup e restauração']];
const DEF_OPER={historico:true,cadastrar:true,editar:true,excluir:false,marcar:true,desfazer:true,cancelar:false,anexar:true,relatorios:true,auditoria:false,config:false,backup:false};
const DEF_CFG=()=>({alertas:{ativo:true,freq:'30',custom:20,inicio:'08:00',fim:'18:00',sabado:false,domingo:false,som:true,windows:true,visual:true},regraDia:'ultimo',diasAtencao:3,limiteAumento:3,supervisor:'',incluirAnteriores:false,empresa:'Hillo',categorias:['Energia elétrica','Água','Internet','Telefonia','Aluguel','Fornecedor','Imposto','Outras']});

/* =====================  UTILIDADES  ===================== */
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
function partsBR(d=new Date()){const p=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d);const o={};p.forEach(x=>o[x.type]=x.value);if(o.hour==='24')o.hour='00';return o;}
function todayStr(){const o=partsBR();return `${o.year}-${o.month}-${o.day}`;}
function nowHM(){const o=partsBR();return o.hour+':'+o.minute;}
function fmtDate(s){if(!s)return '—';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`;}
function fmtDT(iso){if(!iso)return '—';const o=partsBR(new Date(iso));return `${o.day}/${o.month}/${o.year} ${o.hour}:${o.minute}`;}
const fmtMoney=v=>(typeof v==='number'&&isFinite(v))?v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'—';
const fmtMoney0=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const moneyShort=v=>fmtMoney0(v);
const fmtPct=p=>(p>0?'+':'')+p.toFixed(1).replace('.',',')+'%';
function parseMoney(s){s=String(s||'').replace(/[R$\s]/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const v=parseFloat(s);return isFinite(v)?Math.round(v*100)/100:NaN;}
function dim(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate();}
function dowOf(s){const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d)).getUTCDay();}
function diffDays(a,b){const f=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d);};return Math.round((f(b)-f(a))/864e5);}
function addM(ym,n){let [y,m]=ym.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+pad(m);}
function monthsBetween(a,b){const [y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return (y2-y1)*12+(m2-m1);}
function mesLabel(ym){const [y,m]=ym.split('-').map(Number);return `${MESES[m-1]} de ${y}`;}
function fixUrl(u){u=(u||'').trim();if(!u)return '';return /^https?:\/\//i.test(u)?u:'https://'+u;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function sha256(msg){
  const bytes=new TextEncoder().encode(msg);
  const primes=[];for(let n=2;primes.length<64;n++){if(primes.every(p=>n%p))primes.push(n);}
  const frac=x=>x-Math.floor(x);
  const K=primes.map(p=>(frac(Math.cbrt(p))*4294967296)|0);
  let H=primes.slice(0,8).map(p=>(frac(Math.sqrt(p))*4294967296)|0);
  const l=bytes.length,padLen=((l+9+63)>>6)<<6,m=new Uint8Array(padLen);
  m.set(bytes);m[l]=0x80;const dv=new DataView(m.buffer);
  dv.setUint32(padLen-4,(l*8)>>>0);dv.setUint32(padLen-8,Math.floor(l*8/4294967296));
  const w=new Int32Array(64);
  for(let o=0;o<padLen;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getInt32(o+i*4);
    for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2];
      const s0=((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3);
      const s1=((b>>>17)|(b<<15))^((b>>>19)|(b<<13))^(b>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){
      const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));
      const ch=(e&f)^(~e&g);const t1=(h+S1+ch+K[i]+w[i])|0;

let _db=null,MEMORY_ONLY=false;
function openDB(){
  if(_db)return _db;
  _db=new Promise((res,rej)=>{
    const r=indexedDB.open('hillo-contas-fixas-v1',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('anexos',{keyPath:'id'});};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
  return _db;
}
async function tx(store,mode,fn){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const t=db.transaction(store,mode),s=t.objectStore(store),r=fn(s);
    t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
  });
}

function calcDate(c,ym){
  const [y,m]=ym.split('-').map(Number),n=dim(y,m);
  if(c.dia<=n)return `${ym}-${pad(c.dia)}`;
  const regra=c.regraDia||DB.config.regraDia;
  if(regra==='primeiro_proximo')return addM(ym,1)+'-01';
  if(regra==='util_anterior'){let d=n;while([0,6].includes(dowOf(`${ym}-${pad(d)}`)))d--;return `${ym}-${pad(d)}`;}
  return `${ym}-${pad(n)}`;
}
function occursIn(c,ym){
  const k=monthsBetween(c.inicio,ym);
  if(k<0||k%FREQS[c.freq]!==0)return false;
  if(c.fim&&calcDate(c,ym)>c.fim)return false;
  return true;
}
function ensureRange(from,to){
  let created=false;
  for(let ym=from;ym<=to;ym=addM(ym,1)){
    for(const c of DB.contas){
      if(!c.ativa)continue;
      const key=c.id+'|'+ym;
      if(DB.ocs[key]||!occursIn(c,ym))continue;
      DB.ocs[key]={key,contaId:c.id,ym,dataPrevista:calcDate(c,ym),status:'PENDENTE',by:'',at:'',obs:'',justificativa:'',anexos:[],hist:[],snap:snapOf(c)};
      created=true;
    }
  }
  if(created)save();
  return created;
}

  Object.values(DB.ocs).forEach(o=>{if(o.contaId===contaId&&!hasVal(o)&&o.aumento)o.aumento=null;});
  L.forEach((o,i)=>{
    const prev=i?L[i-1]:null;
    if(!prev||!(prev.valor>0)){o.aumento=null;return;}
    const pct=(o.valor-prev.valor)/prev.valor*100;

let actx=null;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,unlockAudio,{passive:true}));
let ringT=null,ringTest=false;

    for(let i=0;i<3;i++){                       /* trim · trim · trim */
      const s0=t0+i*0.58,o=actx.createOscillator(),g=actx.createGain();
      o.type='square';

function startRing(){

function stopRing(){

function notifSupport(){return 'Notification' in window;}
async function askNotifPermission(){
  if(!notifSupport())return 'indisponivel';
  try{const r=await Notification.requestPermission();return r;}catch(e){return Notification.permission;}
}
function winNotify(n,na,teste){
  if(!notifSupport()||Notification.permission!=='granted')return false;
  try{
    let body;
    if(teste)body='Esta é uma notificação de teste do sistema Contas Fixas.';
    else{const p=[];if(n)p.push(`Você possui ${n} conta${n>1?'s':''} pendente${n>1?'s':''} de recebimento!`);if(na)p.push(`${na} aumento${na>1?'s':''} de consumo para informar ao supervisor.`);body=p.join('\n')+'\nVerifique o calendário.';}
    const nt=new Notification('CONTAS FIXAS',{body,icon:LOGO_ICON||undefined,tag:'cf-pend',renotify:true,requireInteraction:true});
    nt.onclick=()=>{window.focus();if(!teste)openPendencias();nt.close();};
    return true;
  }catch(e){return false;}
}
function showAlertBar(n,na){
  na=na||0;const b=$('#alertbar'),pl=(x,a,b2)=>x>1?b2:a;
  let msg;
  if(n&&na)msg=`ATENÇÃO! Você possui ${n} conta${n>1?'s':''} pendente${n>1?'s':''} de recebimento e ${na} aumento${na>1?'s':''} de consumo para informar ao supervisor.`;
  else if(na)msg=`ATENÇÃO! ${na} aumento${na>1?'s':''} de consumo acima de ${DB.config.limiteAumento.toString().replace('.',',')}% ainda não ${na>1?'foram informados':'foi informado'} ao supervisor.`;
  else msg=`ATENÇÃO! Você possui ${n} conta${n>1?'s':''} pendente${n>1?'s':''} de recebimento. Verifique as contas antes que os prazos sejam ultrapassados.`;
  void pl;
  b.innerHTML=`<div class="in"><div style="font-size:30px">🔔</div><div class="t">${msg}</div><button class="btn ghost sm" data-act="alertOpen">Ver pendências</button><button class="btn sm" style="background:rgba(0,0,0,.25)" data-act="alertClose">Fechar e silenciar</button></div>`;
  b.classList.add('on');
}
function lastAlert(){try{return +localStorage.getItem('cf_lastAlert')||0;}catch(e){return 0;}}
function setLastAlert(t){try{localStorage.setItem('cf_lastAlert',String(t));}catch(e){}}
function freqMinutes(a){if(a.freq==='dia')return 'dia';if(a.freq==='custom')return Math.max(1,+a.custom||15);return +a.freq||30;}
function checkAlerts(force){
  if(!DB)return;
  const a=DB.config.alertas;if(!a.ativo&&!force)return;
  const t=todayStr(),dw=dowOf(t),hm=nowHM();
  if(!force){
    if(dw===6&&!a.sabado)return;if(dw===0&&!a.domingo)return;
    if(hm<a.inicio||hm>a.fim)return;
    const f=freqMinutes(a),last=lastAlert(),now=Date.now();
    if(f==='dia'){const ld=last?partsBR(new Date(last)):null;if(ld&&`${ld.year}-${ld.month}-${ld.day}`===t)return;}
    else if(now-last<f*60000)return;
  }
  const n=pendList().length,na=aumentosPend().length;
  if(n+na===0){return;}
  setLastAlert(Date.now());
  if(a.visual||a.som||force)showAlertBar(n,na);
  if(a.som||force)startRing();
  if(a.windows||force)winNotify(n,na);
  updateTitle();
}

function makeIcon(){
  try{
    const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
    x.fillStyle='#1d4ed8';x.beginPath();if(x.roundRect)x.roundRect(4,4,120,120,28);else x.rect(4,4,120,120);x.fill();
    x.strokeStyle='#fff';x.lineWidth=14;x.lineCap='round';x.beginPath();x.moveTo(40,38);x.lineTo(40,90);x.moveTo(88,38);x.lineTo(88,90);x.moveTo(40,64);x.lineTo(88,64);x.stroke();
    LOGO_ICON=c.toDataURL('image/png');
    const l=document.createElement('link');l.rel='icon';l.href=LOGO_ICON;document.head.appendChild(l);
  }catch(e){}
}

function viewHTML(){
  switch(VIEW){
    case 'cal':return calHTML();case 'dash':return dashHTML();case 'contas':return contasHTML();case 'hist':return histHTML();
    case 'audit':return auditHTML();case 'cfg':return cfgHTML();case 'bkp':return bkpHTML();

}

/* ---------- CALENDÁRIO ---------- */
function dayState(list){
  const ss=list.map(o=>situ(o).k).filter(k=>k!=='cancel');
  if(!ss.length)return 'none';
  if(ss.includes('late'))return 'late';if(ss.includes('warn'))return 'warn';if(ss.includes('future'))return 'future';return 'ok';
}
function calHTML(){
  const ym=CUR;ensureRange(addM(ym,-1),ym);
  const [y,m]=ym.split('-').map(Number),off=dowOf(ym+'-01'),n=dim(y,m),today=todayStr();
  const s=stats(ym);let cells='';
  for(let i=0;i<off;i++)cells+='<div class="day out"></div>';
  for(let d=1;d<=n;d++){
    const ds=`${ym}-${pad(d)}`,list=occsOn(ds),st=dayState(list),act=list.filter(o=>o.status!=='CANCELADA').length;
    const chips=list.slice(0,3).map(o=>`<span class="chip c-${situ(o).k}" title="${esc(o.snap.nome)}">${esc(o.snap.nome)}${o.aumento&&!o.aumento.informado?' ▲':''}</span>`).join('');
    cells+=`<div class="day d-${st} ${ds===today?'today':''}" data-act="openDay" data-date="${ds}"><div class="dn"><span>${d}</span>${act?`<span class="cnt">${act}</span>`:''}</div>${chips}${list.length>3?`<span class="more">+${list.length-3} conta${list.length-3>1?'s':''}</span>`:''}</div>`;
  }
  const tot=off+n;for(let i=0;i<(7-tot%7)%7;i++)cells+='<div class="day out"></div>';
  return `<div class="kpis" style="grid-template-columns:repeat(4,1fr)"><div class="kpi"><small>Previstas no mês</small><b>${s.total}</b></div><div class="kpi ok"><small>Concluídas</small><b>${s.rec+s.ret}</b></div><div class="kpi warn"><small>Pendentes</small><b>${s.pend}</b></div><div class="kpi late"><small>Atrasadas</small><b>${s.atr}</b></div></div>
  <div class="card cal"><div class="cal-head"><button class="btn ghost" data-act="calPrev">‹</button><h2>${mesLabel(ym)}</h2><button class="btn ghost" data-act="calNext">›</button><button class="btn" data-act="calToday">Hoje</button>
  <div class="legend"><span><i style="background:var(--ok)"></i>Recebida / retirada</span><span><i style="background:var(--late)"></i>Pendente atrasada</span><span><i style="background:var(--warn)"></i>Vence em até ${DB.config.diasAtencao} dia(s)</span><span><i style="background:var(--fut)"></i>Prevista</span><span><i style="background:var(--gray)"></i>Sem contas</span></div></div>
  <div class="cal-wd">${DOWS.map(d=>`<div>${d}</div>`).join('')}</div><div class="cal-grid">${cells}</div></div>`;
}

/* ---------- OCORRÊNCIAS (modais) ---------- */
function occCard(o,opt={}){
  const s=situ(o),pend=o.status==='PENDENTE',portal=fixUrl(o.snap.portal);
  return `<div class="occ k-${s.k}"><div class="row"><h4>${esc(o.snap.nome)}</h4><span class="sp"></span><span class="badge b-${s.k}">${s.t}</span></div>
  <div class="meta"><span>Fornecedor: <b>${esc(o.snap.fornecedor||'—')}</b></span><span>Data prevista: <b>${fmtDate(o.dataPrevista)}</b>${pend?` (${prazoTxt(o)})`:''}</span>${opt.cat?`<span>Categoria: <b>${esc(o.snap.categoria||'—')}</b></span>`:''}
  <span>Responsável pelo registro: <b>${esc(o.by||'—')}</b></span><span>Recebida em: <b>${isDone(o)?fmtDT(o.at):'—'}</b></span>${isDone(o)?`<span>Valor: <b>${typeof o.valor==='number'?fmtMoney(o.valor):'não informado'}</b></span>`:''}</div>${aumLine(o)}
  <div class="acts">${portal?`<button class="btn ghost sm" data-act="portal" data-key="${esc(o.key)}">🌐 Acessar portal</button>`:''}
  ${pend&&can('marcar')?`<button class="btn ok sm" data-act="markRec" data-key="${esc(o.key)}">✔ Marcar como recebida</button><button class="btn sm" data-act="markRet" data-key="${esc(o.key)}">⬇ Retirada do portal</button>`:''}
  ${pend&&can('cancelar')?`<button class="btn ghost sm" data-act="markCan" data-key="${esc(o.key)}">Cancelar</button>`:''}
  ${isDone(o)&&can('marcar')?`<button class="btn ghost sm" data-act="editVal" data-key="${esc(o.key)}">✎ ${typeof o.valor==='number'?'Corrigir valor':'Informar valor'}</button>`:''}
  ${o.aumento&&!o.aumento.informado&&can('marcar')?`<button class="btn amber sm" data-act="infoSup" data-key="${esc(o.key)}">📣 Informar ao supervisor</button>`:''}
  ${!pend&&can('desfazer')?`<button class="btn amber sm" data-act="undo" data-key="${esc(o.key)}">↩ Desfazer marcação</button>`:''}
  <button class="btn ghost sm" data-act="openOcc" data-key="${esc(o.key)}">Detalhes${o.anexos.length?` · 📎${o.anexos.length}`:''}</button></div></div>`;
}
function openDay(date){
  openModal({title:()=>`${DOWL[dowOf(date)]}, ${fmtDate(date)}`,live:true,wide:true,
    body:()=>{const L=occsOn(date);return L.length?L.map(o=>occCard(o)).join(''):'<div class="empty">Nenhuma conta prevista para este dia.</div>';},
    footer:`<button class="btn ghost" data-act="closeTop">Fechar</button>`});

/* ---------- PAINEL ---------- */
function barSVG(rows){
  const W=680,H=250,pl=34,pb=28,pt=12,max=Math.max(1,...rows.map(r=>r.a+r.b)),bw=(W-pl)/rows.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart">`;
  for(let i=0;i<=4;i++){const y=pt+(H-pt-pb)*(1-i/4);s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" class="grid"/><text x="${pl-6}" y="${y+4}" text-anchor="end" class="axis">${Math.round(max*i/4)}</text>`;}
  rows.forEach((r,i)=>{
    const x=pl+i*bw+bw*.18,w=bw*.64,hA=(H-pt-pb)*r.a/max,hB=(H-pt-pb)*r.b/max,yA=H-pb-hA,yB=yA-hB;
    if(r.a)s+=`<rect x="${x}" y="${yA}" width="${w}" height="${hA}" fill="#16a34a" rx="3"><title>${r.label}: ${r.a} concluída(s)</title></rect>`;
    if(r.b)s+=`<rect x="${x}" y="${yB}" width="${w}" height="${hB}" fill="#ef4444" rx="3"><title>${r.label}: ${r.b} pendente(s)</title></rect>`;
    s+=`<text x="${x+w/2}" y="${H-10}" text-anchor="middle" class="axis">${r.label}</text>`;
  });
  return s+'</svg>';
}
function lineSVG(rows){
  const W=680,H=200,pl=34,pb=26,pt=12,n=rows.length,step=(W-pl-20)/Math.max(1,n-1);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart">`;
  for(let i=0;i<=4;i++){const y=pt+(H-pt-pb)*(1-i/4);s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" class="grid"/><text x="${pl-6}" y="${y+4}" text-anchor="end" class="axis">${i*25}%</text>`;}
  const pts=rows.map((r,i)=>[pl+10+i*step,pt+(H-pt-pb)*(1-r.p/100)]);
  s+=`<polyline fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#fff" stroke="#2563eb" stroke-width="2.5"><title>${rows[i].label}: ${rows[i].p}%</title></circle><text x="${p[0]}" y="${H-8}" text-anchor="middle" class="axis">${rows[i].label}</text>`;});
  return s+'</svg>';
}
function donutSVG(segs){
  const tot=segs.reduce((a,b)=>a+b.v,0),R=70,C=2*Math.PI*R;let acc=0;
  let s=`<svg viewBox="0 0 200 200" style="width:200px;height:200px"><circle cx="100" cy="100" r="${R}" fill="none" stroke="#eaf0fb" stroke-width="26"/>`;
  if(tot)segs.forEach(g=>{if(!g.v)return;const len=C*g.v/tot;s+=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${g.c}" stroke-width="26" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 100 100)"><title>${g.l}: ${g.v}</title></circle>`;acc+=len;});
  return s+`<text x="100" y="104" text-anchor="middle" font-size="30" font-weight="800" fill="#0b2a6f">${tot}</text><text x="100" y="124" text-anchor="middle" font-size="11" fill="#64748b">contas</text></svg>`;
}

function saveConta(id){
  const g=i=>$('#'+i).value.trim(),err=m=>{$('#f_err').textContent=m;};
  const nome=g('f_nome'),dia=parseInt(g('f_dia'),10),inicio=g('f_inicio'),fim=g('f_fim'),freq=g('f_freq'),forn=g('f_forn');
  if(!nome)return err('Informe o nome da conta.');
  if(!(dia>=1&&dia<=31))return err('O dia previsto deve estar entre 1 e 31.');
  if(!/^\d{4}-\d{2}$/.test(inicio))return err('Informe o mês de início da recorrência.');
  if(fim&&fim<inicio+'-01')return err('A data de encerramento não pode ser anterior ao início.');
  const portal=g('f_portal');if(portal&&!/^(https?:\/\/)?[^\s\/]+\.[^\s]{2,}.*$/i.test(portal)&&!/^https?:\/\/(localhost|\d+\.\d+\.\d+\.\d+)/i.test(portal))return err('O link do portal parece inválido.');
  const dup=DB.contas.find(c=>c.id!==id&&c.nome.toLowerCase()===nome.toLowerCase()&&(c.fornecedor||'').toLowerCase()===forn.toLowerCase()&&c.dia===dia&&c.freq===freq);
  if(dup)return err('Já existe uma conta idêntica (mesmo nome, fornecedor, dia e frequência).');
  const dados={nome,categoria:g('f_cat'),fornecedor:forn,descricao:g('f_desc'),dia,inicio,fim,freq,portal,obs:g('f_obs'),responsavel:g('f_resp'),ativa:g('f_ativa')==='1',regraDia:g('f_regra')};
  if(dados.categoria&&!DB.config.categorias.some(x=>x.toLowerCase()===dados.categoria.toLowerCase()))DB.config.categorias.push(dados.categoria);
  if(id){
    const c=contaById(id),ant=JSON.stringify(c);Object.assign(c,dados);
    Object.values(DB.ocs).forEach(o=>{if(o.contaId===id&&o.status==='PENDENTE'){o.snap=snapOf(c);o.dataPrevista=calcDate(c,o.ym);}});
    audit('Alterou cadastro de conta',c.nome,'Dados atualizados');void ant;
  }else{
    const c=Object.assign({id:'c'+DB.seq++,criadoEm:new Date().toISOString(),criadoPor:SESSION.nome},dados);DB.contas.push(c);
    audit('Cadastrou conta',c.nome,`${FREQ_LABEL[c.freq]} · dia ${c.dia} · início ${c.inicio}`);
  }
  save();closeModal(MODALS[MODALS.length-1].id);ensureRange(todayStr().slice(0,7),todayStr().slice(0,7));refreshAll();toast('Conta salva.','ok');
}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  files.forEach(([name,content])=>{
    const nb=enc.encode(name),db=enc.encode(content),crc=crc32(db);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,db.length,true);lh.setUint32(22,db.length,true);lh.setUint16(26,nb.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nb,db);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,db.length,true);ch.setUint32(24,db.length,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),nb);
    off+=30+nb.length+db.length;
  });
  const cdSize=cd.reduce((a,b)=>a+b.length,0),eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true);eo.setUint16(8,files.length,true);eo.setUint16(10,files.length,true);eo.setUint32(12,cdSize,true);eo.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(eo.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function makeXlsx(sheet,rows,widths){
  const x=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
  const colL=i=>{let s='';i++;while(i>0){const r=(i-1)%26;s=String.fromCharCode(65+r)+s;i=Math.floor((i-1)/26);}return s;};
  let sd='';rows.forEach((r,ri)=>{sd+=`<row r="${ri+1}">`;r.forEach((v,ci)=>{sd+=`<c r="${colL(ci)}${ri+1}" t="inlineStr"${ri===0?' s="1"':''}><is><t xml:space="preserve">${x(v)}</t></is></c>`;});sd+='</row>';});
  const NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main',RN='http://schemas.openxmlformats.org/officeDocument/2006/relationships',H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  return zipStore([
    ['[Content_Types].xml',H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],
    ['_rels/.rels',H+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${RN}/officeDocument" Target="xl/workbook.xml"/></Relationships>`],

const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(b);});
const b64ToBlob=(b,t)=>{const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:t||'application/octet-stream'});};
async function buildBackup(){
  const out={app:'hillo-contas-fixas',versao:1,geradoEm:new Date().toISOString(),state:DB,logo:LOGO,anexos:[]};
  for(const a of await anAll())out.anexos.push({id:a.id,name:a.name,type:a.type,data:await blobToB64(a.blob)});
  return new Blob([JSON.stringify(out)],{type:'application/json'});
}
async function snapshots(){return (await kvGet('snapshots'))||[];}
async function dailySnapshot(){
  try{
    const t=todayStr(),L=await snapshots();
    if(L.some(s=>s.dia===t))return;
    L.push({dia:t,em:new Date().toISOString(),state:JSON.parse(JSON.stringify(DB))});
    while(L.length>30)L.shift();
    await kvSet('snapshots',L);
  }catch(e){}
}
async function folderBackup(manual){
  try{
    const h=await kvGet('backupDir');if(!h)return false;
    const t=todayStr();
    if(!manual&&(await kvGet('backupDirDia'))===t)return true;
    let p=await h.queryPermission({mode:'readwrite'});
    if(p!=='granted'){if(!manual){showBackupBanner();return false;}p=await h.requestPermission({mode:'readwrite'});if(p!=='granted')return false;}
    const blob=await buildBackup(),fh=await h.getFileHandle(`CONTAS-FIXAS_BACKUP_${t}.json`,{create:true}),w=await fh.createWritable();
    await w.write(blob);await w.close();await kvSet('backupDirDia',t);
    return true;
  }catch(e){if(manual)toast('Não foi possível gravar na pasta: '+(e&&e.message||e),'err');return false;}
}

async function restoreState(st,anexos,logo,label){
  await dailySnapshotForce('Antes de restaurar');
  DB=normalize(st);DB.rev=Date.now();
  if(anexos){await anClear();for(const a of anexos)await anPut({id:a.id,name:a.name,type:a.type,blob:b64ToBlob(a.data,a.type)});}
  if(logo!==undefined){LOGO=logo||'';await kvSet('logo',LOGO);}
  syncSession();
  audit('Restaurou backup',label,'');
  await flush();refreshAll();
}
async function dailySnapshotForce(){try{const L=await snapshots();const t=todayStr();const i=L.findIndex(s=>s.dia===t);const e={dia:t,em:new Date().toISOString(),state:JSON.parse(JSON.stringify(DB))};if(i>=0)L[i]=e;else L.push(e);while(L.length>30)L.shift();await kvSet('snapshots',L);}catch(e){}}

});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const m=MODALS[MODALS.length-1];if(m)closeModal(m.id);}

document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.input;if(!k)return;
  if(k==='contasQ'){UI.contasQ=e.target.value;$('#contasBody').innerHTML=contasRows();}
  else if(k==='vPrev'){updVPrev(e.target.dataset.key,e.target);}
  else if(k==='audQ'){UI.audQ=e.target.value;$('#audBody').innerHTML=audRows();}
  else if(k==='hf:q'){HF.q=e.target.value;$('#histBody').innerHTML=histRows();$('#histCount').textContent=histList().length+' registro(s)';}
});
document.addEventListener('change',async e=>{
  const el=e.target,k=el.dataset&&el.dataset.change;if(!k)return;
  if(k==='contasS'){UI.contasS=el.value;renderApp();}
  else if(k==='evoConta'){UI.evoConta=el.value;renderApp();}
  else if(k==='audA'){UI.audA=el.value;$('#audBody').innerHTML=audRows();}
  else if(k==='audU'){UI.audU=el.value;$('#audBody').innerHTML=audRows();}
  else if(k.startsWith('hf:')){HF[k.slice(3)]=el.value;renderApp();}
  else if(k==='cfgFreq'){$('#c_customBox').style.display=el.value==='custom'?'block':'none';}
  else if(k==='uPerfil'){$('#u_permbox').style.display=el.value==='admin'?'none':'block';}
  else if(k==='attach'){
    const file=el.files[0];if(!file)return;
    if(file.size>25*1024*1024){toast('O arquivo excede 25 MB.','err');el.value='';return;}
    const o=DB.ocs[el.dataset.key];if(!o)return;
    try{const id='a'+DB.seq++;await anPut({id,name:file.name,type:file.type,blob:file});
      o.anexos.push({id,name:file.name,size:file.size,type:file.type,por:SESSION.nome,em:new Date().toISOString()});
      o.hist.push({acao:o.status,de:o.status,por:SESSION.nome,em:new Date().toISOString(),obs:'Anexo adicionado: '+file.name});
      audit('Anexou arquivo',`${o.snap.nome} · ${fmtDate(o.dataPrevista)}`,file.name);save();refreshAll();toast('Arquivo anexado.','ok');
    }catch(err){toast('Falha ao anexar o arquivo.','err');}
  }
  else if(k==='logoUp'){
    const file=el.files[0];if(!file)return;
    if(file.size>2*1024*1024){toast('A imagem deve ter até 2 MB.','err');return;}
    const r=new FileReader();r.onload=async()=>{LOGO=r.result;try{await kvSet('logo',LOGO);}catch(err){}audit('Alterou logotipo','Logotipo','');save();refreshAll();toast('Logotipo atualizado.','ok');};r.readAsDataURL(file);
  }
  else if(k==='bkRestore'){
    const file=el.files[0];if(!file)return;
    try{
      const j=JSON.parse(await file.text());
      if(j.app!=='hillo-contas-fixas'||!j.state||!Array.isArray(j.state.contas))throw new Error('Arquivo de backup inválido.');
      if(!await confirmBox(`Restaurar o backup de <b>${fmtDT(j.geradoEm)}</b>? Todos os dados atuais serão substituídos.`,'Restaurar backup',true)){el.value='';return;}
      await restoreState(j.state,j.anexos||[],j.logo||'','Arquivo '+file.name);toast('Backup restaurado com sucesso.','ok');
    }catch(err){toast('Falha ao restaurar: '+(err&&err.message||err),'err');}
    el.value='';
  }
});

/* =====================  INICIALIZAÇÃO  ===================== */
async function init(){
  try{
    DB=normalize(await kvGet('state'));LOGO=(await kvGet('logo'))||'';
  }catch(e){
    MEMORY_ONLY=true;DB=normalize(null);
    setTimeout(()=>toast('Armazenamento do navegador indisponível: os dados NÃO serão salvos. Abra o arquivo no Chrome ou Edge, sem navegação privada.','err'),300);
  }
  makeIcon();
  try{const sid=sessionStorage.getItem('cf_user');if(sid)SESSION=DB.usuarios.find(u=>u.id===sid&&u.ativo)||null;}catch(e){}
  try{bc=new BroadcastChannel('hillo-contas-fixas');bc.onmessage=async()=>{await reloadIfNewer();};}catch(e){}
  renderApp();
  if(SESSION)afterLogin();
  dailySnapshot();
  setInterval(tickClock,15000);
  setInterval(()=>{checkAlerts(false);if(SESSION){updateTitle();}},20000);
  setInterval(()=>{if(SESSION&&!MODALS.length&&!document.querySelector('input:focus,textarea:focus,select:focus'))refreshAll();},60000);
  addEventListener('focus',reloadIfNewer);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();else reloadIfNewer();});
  addEventListener('beforeunload',()=>{flush();});
}
init();
