  return isLightTheme()
    ? {text:'#57626C', grid:'#E5E8EB', tooltipBg:'#FFFFFF', tooltipBorder:'#D7DCE1'}
    : {text:'#8D98A3', grid:'#242E38', tooltipBg:'#152B46', tooltipBorder:'#33404B'};
}
function mkChart(canvasId, type, data, options={}, onClickDim=null, rawLabels=null){
  destroyChart(canvasId);
  const el = document.getElementById(canvasId);
  if(!el) return;
  if(typeof Chart === 'undefined'){
    const wrap = el.closest('.chart-wrap');
    if(wrap) wrap.innerHTML = `<div class="empty"><div class="glyph">&#9888;</div><div class="msg">Não foi possível carregar a biblioteca de gráficos (Chart.js) — nem do arquivo local (vendor/chart.umd.min.js) nem da internet. Verifique sua conexão ou copie o arquivo para a pasta "vendor/". O restante do painel (KPIs, tabelas e filtros) continua funcionando normalmente.</div></div>`;
    return;
  }
  try{
  const ct = chartTheme();
  Chart.defaults.color = ct.text;
  Chart.defaults.font.family = getComputedStyle(document.documentElement).getPropertyValue('--font-sans').trim() || 'Arial, sans-serif';
  Chart.defaults.borderColor = ct.grid;
  const finalOptions = Object.assign({
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{display:!!options.legend, labels:{boxWidth:10,usePointStyle:true,padding:14}}, tooltip:{backgroundColor:ct.tooltipBg,borderColor:ct.tooltipBorder,borderWidth:1,padding:10,titleColor: isLightTheme()?'#16232E':'#EEF2F5', bodyColor: isLightTheme()?'#16232E':'#EEF2F5'} },
    scales: type==='doughnut'||type==='pie' ? {} : {
      x:{grid:{display:false}, ticks:{maxRotation:0}},
      y:{grid:{color:ct.grid}, ticks:{callback:v=> (Math.abs(v)>=1000? (v/1000)+'k': v)}}
    },
    onClick: onClickDim ? (evt, elements, chart)=>{
      if(!elements.length) return;
      const idx = elements[0].index;
      const raw = rawLabels ? rawLabels[idx] : chart.data.labels[idx];
      setCrossFilter(onClickDim, raw);
    } : undefined,
  }, options);
  charts[canvasId] = new Chart(el.getContext('2d'), {type, data, options: finalOptions});
  }catch(err){
    const wrap = el.closest('.chart-wrap');
    if(wrap) wrap.innerHTML = `<div class="empty"><div class="glyph">&#9888;</div><div class="msg">Não foi possível desenhar este gráfico.</div></div>`;
    console.error('mkChart error', canvasId, err);
  }
}
function chartCard(containerId, hasData, renderFn){
  const el = document.getElementById(containerId);
  if(!hasData){ el.closest('.chart-wrap').innerHTML = `<div class="empty"><div class="glyph">&#9711;</div><div class="msg">Sem dados suficientes na base atual para este gráfico.</div></div>`; return; }
  renderFn();
}

/* ---------- 7b. IMPRESSÃO INDIVIDUAL DE GRÁFICO (A4 paisagem) ----------
   Cada card com gráfico ganha um botão de impressão. Ele gera o PNG do próprio Chart.js
   (toBase64Image) e monta uma página impressa isolada — título, subtítulo, filtro/período
   ativos e a imagem — dentro de um iframe oculto com @page{size:A4 landscape}, e dispara
   window.print() só daquele iframe. Isso evita imprimir o painel inteiro (sidebar, filtros,
   outros cards) e garante que sempre sai 1 gráfico por folha A4 deitada. */
function describeCurrentFilters(){
  const bits = [];
  const per = document.getElementById('f_periodo');
  if(per) bits.push('Período: '+per.options[per.selectedIndex].text);
  MULTI_FILTERS.forEach(cfg=>{
    const f = FILTERS[cfg.key];
    if(f && f.mode!=='all'){
      const label = document.getElementById(`f_${cfg.key}_label`);
      if(label) bits.push(label.textContent);
    }
  });
  if(FILTERS.fluxo && FILTERS.fluxo.mode!=='all'){
    bits.push(FILTERS.fluxo.values.length===1 ? `NOME_FLUXO: ${FILTERS.fluxo.mode==='include'?'':'exceto '}${FILTERS.fluxo.values[0]}` : `NOME_FLUXO: ${FILTERS.fluxo.values.length} ${FILTERS.fluxo.mode==='include'?'selecionados':'excluídos'}`);
  }
  const visBtn = document.querySelector('#viewToggle button.active');
  if(visBtn && FILTERS.visao!=='consolidada') bits.push('Visão: '+visBtn.textContent);
  if(FILTERS.compare!=='none'){
    const cmp = document.getElementById('f_compare');
    if(cmp) bits.push('Comparando com: '+cmp.options[cmp.selectedIndex].text);
  }
  if(crossFilter) bits.push('Seleção: '+crossFilter.value);
  return bits.length? bits.join(' · ') : 'Todo o período · Todas as empresas';
}
function openPrintDoc(bodyHtml, docTitle){
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(docTitle)}</title>
<style>
  @page{ size:A4 landscape; margin:12mm 14mm; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#16232E;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .pg{width:100%;page-break-after:always;break-inside:avoid;page-break-inside:avoid;}
  .pg:last-child{page-break-after:auto;}
  .ph{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;margin-bottom:16px;background:#EAF3F4;border-radius:8px;border:1px solid #D7E4E5;}
  .ph .brand{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:#283ED6;letter-spacing:.3px;text-transform:uppercase;}
  .ph .brand .dot{width:8px;height:8px;border-radius:50%;background:#283ED6;box-shadow:0 0 0 3px rgba(40,62,214,.18);}
  .meta{font-size:10px;color:#5C6670;text-align:right;white-space:nowrap;line-height:1.5;}
  .ttl{border-bottom:2px solid #283ED6;padding-bottom:10px;margin-bottom:16px;}
  .ttl h1{font-size:20px;margin:0 0 3px;font-weight:700;color:#16232E;}
  .ttl .sub{font-size:12px;color:#5C6670;}
  .chart-box{height:138mm;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#FFFFFF;border:1px solid #E5E8EB;border-radius:10px;padding:16px;box-sizing:border-box;break-inside:avoid;page-break-inside:avoid;}
  .chart-box img{max-width:100%;max-height:100%;object-fit:contain;}
  .noimg{font-size:12px;color:#B9791F;}
  .foot{margin-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:9.5px;color:#8D98A3;border-top:1px solid #E5E8EB;padding-top:8px;}
  .foot .ptag{background:#EAF3F4;color:#283ED6;font-weight:700;border-radius:20px;padding:3px 10px;}
</style></head><body>${bodyHtml}</body></html>`;
  const ifr = document.createElement('iframe');
  ifr.style.position='fixed'; ifr.style.right='0'; ifr.style.bottom='0'; ifr.style.width='0'; ifr.style.height='0'; ifr.style.border='0';
  ifr.setAttribute('aria-hidden','true');
  document.body.appendChild(ifr);
  const doc = ifr.contentWindow.document;
  doc.open(); doc.write(html); doc.close();
  const finish = ()=>{
    try{ ifr.contentWindow.focus(); ifr.contentWindow.print(); }catch(err){ console.error('print error', err); }
    setTimeout(()=>{ if(ifr.parentNode) ifr.parentNode.removeChild(ifr); }, 1500);
  };
  if(doc.readyState==='complete') setTimeout(finish, 200);
  else ifr.onload = ()=> setTimeout(finish, 200);
}
/* Gera uma imagem do gráfico numa resolução própria para impressão (bem maior que o
   canvas pequeno exibido na tela), usando um canvas invisível e uma instância Chart.js
   temporária — o gráfico visível no painel não é alterado nem pisca durante o processo. */
function chartHiResImage(canvasId, exportW=3000, exportH=1700){
  const orig = charts[canvasId];
  if(!orig) return null;
  const off = document.createElement('canvas');
  off.width = exportW; off.height = exportH;
  let tmp;
  try{
    const bigFont = {size:34};
    const bigFontSmall = {size:30};
    const origPlugins = orig.options.plugins || {};
    const origLegend = origPlugins.legend || {};
    const origScales = orig.options.scales || {};
    const scaleClone = {};
    Object.keys(origScales).forEach(axisKey=>{
      const ax = origScales[axisKey] || {};
      scaleClone[axisKey] = Object.assign({}, ax, {
        ticks: Object.assign({}, ax.ticks||{}, {font:bigFontSmall}),
        title: ax.title ? Object.assign({}, ax.title, {font:bigFont}) : ax.title,
        grid: Object.assign({}, ax.grid||{}, {lineWidth:1.5})
      });
    });
    tmp = new Chart(off.getContext('2d'), {
      type: orig.config.type,
      data: orig.data,
      options: Object.assign({}, orig.options, {
        responsive:false, maintainAspectRatio:false, animation:false, devicePixelRatio:1,
        layout: Object.assign({padding:20}, orig.options.layout),
        plugins: Object.assign({}, origPlugins, {
          legend: Object.assign({}, origLegend, {
            labels: Object.assign({}, origLegend.labels||{}, {font:bigFontSmall, boxWidth:26, padding:24})
          })
        }),
        scales: Object.keys(scaleClone).length ? scaleClone : undefined
      })
    });
    tmp.update('none');
    return tmp.toBase64Image('image/png', 1);
  }catch(err){
    console.error('chartHiResImage', err);
    return orig.toBase64Image('image/png', 1); // fallback: imagem no tamanho de tela mesmo
  }finally{
    if(tmp) tmp.destroy();
  }
}
function chartPrintFragment(canvas, idx, total){
  const card = canvas.closest('.card');

  const sub = card && card.querySelector('.card-sub') ? card.querySelector('.card-sub').textContent.replace(/·\s*clique.*$/i,'').trim() : '';
  const img = chartHiResImage(canvas.id);
  const periodo = describeCurrentFilters();
  const pageTag = (idx && total) ? `<div class="ptag">Gráfico ${idx} de ${total}</div>` : '';
  return `<section class="pg">
    <div class="ph">
      <div class="brand"><span class="dot"></span>Painel Financeiro</div>
      <div class="meta">${esc(periodo)}<br>Gerado em ${esc(new Date().toLocaleString('pt-BR'))}</div>
    </div>
    <div class="ttl"><h1>${esc(title)}</h1>${sub?`<div class="sub">${esc(sub)}</div>`:''}</div>
    <div class="chart-box">${img?`<img src="${img}">`:'<div class="noimg">Não foi possível gerar a imagem deste gráfico.</div>'}</div>
    <div class="foot"><span>Painel Financeiro — relatório gerado automaticamente</span>${pageTag}</div>
  </section>`;
}
function printChart(canvasId){
  const canvas = document.getElementById(canvasId);

function printAllCharts(){

/* ---------- 7c. EXIBIR GRÁFICO AMPLIADO (pop-up) ----------
   Reaproveita o tipo/dados/opções do gráfico já renderizado na tela (mesmas cores,
   legendas, eixos) e recria uma instância Chart.js própria, maior, dentro do modal —
   não mexe no gráfico original. O clique-para-filtrar (onClick/crossfilter) é
   desativado nessa cópia, já que aplicar um filtro fecharia o próprio pop-up. */
let chartModalInstance = null;
function openChartModal(canvasId){
  const orig = charts[canvasId];
  if(!orig){ return; }
  const canvas = document.getElementById(canvasId);
  const card = canvas.closest('.card');
  const title = card && card.querySelector('.card-title') ? card.querySelector('.card-title').textContent : 'Gráfico';
  const sub = card && card.querySelector('.card-sub') ? card.querySelector('.card-sub').textContent.replace(/·\s*clique.*$/i,'').trim() : '';
  document.getElementById('chartModalTitle').innerHTML = `${esc(title)}${sub?`<span class="chart-modal-sub">${esc(sub)}</span>`:''}`;
  if(chartModalInstance){ try{ chartModalInstance.destroy(); }catch(e){} chartModalInstance = null; }
  const modalCanvas = document.getElementById('chartModalCanvas');
  document.getElementById('chartModalError').style.display = 'none';
  modalCanvas.style.display = '';
  // reseta o buffer do canvas de uma abertura anterior, para não herdar tamanho/pixels antigos
  modalCanvas.removeAttribute('width'); modalCanvas.removeAttribute('height'); modalCanvas.removeAttribute('style');
  document.getElementById('chartModalBg').classList.add('active');
  /* O Chart.js só descobre o tamanho real do canvas depois que o navegador terminar de
     calcular o layout do modal (ele acabou de passar de display:none para display:flex,
     então no instante desta função o canvas ainda mede 0x0). Se o gráfico for criado
     nesse exato instante, ele fica "vazio" e nunca mais se redesenha sozinho. Por isso,
     esperamos dois quadros de animação (tempo do navegador aplicar o layout do modal)
     antes de instanciar o gráfico — e, por garantia extra, chamamos .resize() logo em
     seguida para forçar uma nova medição. */
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      if(!document.getElementById('chartModalBg').classList.contains('active')) return; // fechou antes de abrir
      try{
        /* Não reaproveitamos orig.options nem orig.data diretamente: depois que um gráfico já
           está vivo na tela, o Chart.js enriquece esses objetos com estado interno (referências
           de resolução de opções, metadados por dataset etc.) — passar esse mesmo objeto "usado"
           para um SEGUNDO gráfico (o do pop-up) faz o Chart.js quebrar ao tentar reaproveitar
           esse estado. Por isso reconstruímos as opções do zero (mesmo esquema de cores/eixos
           do mkChart) e clonamos só o necessário dos dados. */
        const ct = chartTheme();
        const type = orig.config.type;
        const legendOn = !!(orig.options.plugins && orig.options.plugins.legend && orig.options.plugins.legend.display);
        const modalOptions = {
          responsive:true, maintainAspectRatio:false, animation:false,
          plugins:{
            legend:{display:legendOn, labels:{boxWidth:10,usePointStyle:true,padding:14}},
            tooltip:{backgroundColor:ct.tooltipBg,borderColor:ct.tooltipBorder,borderWidth:1,padding:10,titleColor:isLightTheme()?'#16232E':'#EEF2F5',bodyColor:isLightTheme()?'#16232E':'#EEF2F5'}
          },
          scales: (type==='doughnut'||type==='pie') ? {} : {
            x:{grid:{display:false}, ticks:{maxRotation:0}},
            y:{grid:{color:ct.grid}, ticks:{callback:v=> (Math.abs(v)>=1000? (v/1000)+'k': v)}}
          }
        };
        const modalData = {
          labels: orig.data.labels ? orig.data.labels.slice() : undefined,
          datasets: orig.data.datasets.map(ds=> Object.assign({}, ds))
        };
        chartModalInstance = new Chart(modalCanvas.getContext('2d'), { type, data: modalData, options: modalOptions });
        chartModalInstance.resize();
      }catch(err){
        console.error('openChartModal', err);
        modalCanvas.style.display = 'none';
        document.getElementById('chartModalError').style.display = '';
      }
    });
  });
}
function closeChartModal(){
  document.getElementById('chartModalBg').classList.remove('active');
  if(chartModalInstance){ try{ chartModalInstance.destroy(); }catch(e){} chartModalInstance = null; }
}
document.getElementById('chartModalClose').addEventListener('click', closeChartModal);
document.getElementById('chartModalBg').addEventListener('click', e=>{ if(e.target.id==='chartModalBg') closeChartModal(); });
/* ESC fecha o pop-up do gráfico (e, por consistência, o modal de detalhe do lançamento também). */
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  if(document.getElementById('chartModalBg').classList.contains('active')) closeChartModal();
  else if(document.getElementById('modalBg').classList.contains('active')) document.getElementById('modalBg').classList.remove('active');
});

/* Injeta os botões de "Exibir" (pop-up ampliado) e "Imprimir" em cada card que tenha um
   gráfico Chart.js já renderizado. Chamado depois de cada renderPage()/renderExecutivo() —
   nunca antes, senão o gráfico ainda não existe em `charts` e os botões ficariam "mortos". */
function decoratePrintButtons(root){
  if(!root) return;
  root.querySelectorAll('.chart-wrap canvas').forEach(canvas=>{
    if(!canvas.id || !charts[canvas.id]) return;
    const card = canvas.closest('.card');
    if(!card || card.querySelector('.chart-actions')) return;
    const wrap = document.createElement('div');
    wrap.className = 'chart-actions';
    const viewBtn = document.createElement('button');
    viewBtn.type = 'button';
    viewBtn.className = 'chart-icon-btn';
    viewBtn.title = 'Exibir este gráfico ampliado';
    viewBtn.innerHTML = '&#128269;';
    viewBtn.addEventListener('click', e=>{ e.stopPropagation(); openChartModal(canvas.id); });
    const printBtn = document.createElement('button');
    printBtn.type = 'button';
    printBtn.className = 'chart-icon-btn';
    printBtn.title = 'Imprimir este gráfico (A4 paisagem)';
    printBtn.innerHTML = '&#128438;';
    printBtn.addEventListener('click', e=>{ e.stopPropagation(); printChart(canvas.id); });
    wrap.appendChild(viewBtn);
    wrap.appendChild(printBtn);
    card.appendChild(wrap);
  });
}

/* ============================================================
   8. AGGREGATION HELPERS
   ============================================================ */
function sumBy(recs, filterFn){ return recs.filter(filterFn).reduce((a,r)=>a+r.valor,0); }
/* "Entradas" líquida: soma tudo que é Entrada e desconta o valor TOTAL da categoria
   Desconto Duplicata (tanto os lançamentos de natureza Entrada quanto os de natureza
   Despesa dentro dessa categoria) — o valor de antecipação não deve compor o card
   Entradas em nenhuma hipótese, mas permanece integralmente no card Valores Antecipados. */
const isEmprestimoEntrada = r=>isEntrada(r)&&keywordMatch(r.conta,KW.emprestimo);
function entradasLiquidas(recs){
  return sumBy(recs, isEntrada) - sumBy(recs, r=>keywordMatch(r.conta,KW.descontoDuplicata));
}
function groupSum(recs, keyFn, filterFn=()=>true){ const m = new Map(); recs.filter(filterFn).forEach(r=>{ const k=keyFn(r); m.set(k,(m.get(k)||0)+r.valor); }); return m; }
function sortedMonths(recs){ return [...new Set(recs.map(r=>monthKey(r.data)))].sort(); }

/* ============================================================
   9. PAGE RENDERERS
   ============================================================ */
function renderAll(){ PAGES.forEach(p=>renderPage(p.id)); }
/* Antes, toda mudança de filtro chamava renderAll() e recalculava as 12 páginas do menu, mesmo as
   11 que estão escondidas (display:none). Com bases grandes isso trava a UI a cada clique. Como
   goTo() já re-renderiza a página ao entrar nela, só precisamos manter a página ativa atualizada
   quando o filtro muda — as demais são recalculadas sob demanda quando o usuário navega até elas. */
function renderActive(){ if(VIEW_MODE==='executivo'){ renderExecutivo(); } else { renderPage(activePage); } }
function renderPage(id){
  const fn = RENDERERS[id]; if(!fn) return;
  try{
    fn();
    decoratePrintButtons(document.getElementById('sec-'+id));
    fitKpiCards(document.getElementById('sec-'+id));
  }
  catch(err){
    console.error('renderPage error', id, err);
    const el = document.getElementById('sec-'+id);
    if(el) el.innerHTML = `<div class="banner">Ocorreu um erro ao carregar esta página. Tente limpar os filtros ou recarregar a planilha. (${(err&&err.message)||err})</div>`;
  }
}
/* Reduz a fonte de cada valor de card até caber em uma linha, sem estourar o card —
   necessário porque números em R$ com centavos variam muito de largura (R$ 9,00 a
   R$ 999.999.999,99) e nenhum tamanho fixo cabe em todos os casos. */
function fitKpiCards(root){
  if(!root) return;
  root.querySelectorAll('.kpi-value').forEach(elv=>{
    elv.style.whiteSpace = 'nowrap';
    elv.style.fontSize = '';
    if(!elv.clientWidth) return; // card ainda não está visível/medível (ex.: página oculta)
    let size = parseFloat(getComputedStyle(elv).fontSize);
    let guard = 0;
    while(elv.scrollWidth > elv.clientWidth + 1 && size > 10 && guard < 20){
      size -= 1;
      elv.style.fontSize = size + 'px';
      guard++;
    }
  });
}
/* Ícones e tons de fundo por KPI — casa com os nomes usados na Diretoria (que aparecem
   também na referência visual); qualquer outro KPI usado nas demais páginas cai num tom
   neutro coerente (verde/vermelho quando cls indicar, azul-suave como padrão). */
const KPI_ICONS = {
  'Entradas':'&#8593;', 'Saídas':'&#8595;', 'Saldo do período':'&#128179;',
  'Geração operacional':'&#9881;', 'Empréstimos captados':'&#128176;',
  'Antecipações':'&#8987;', 'Recup. inadimplência':'&#37;', 'Custo financeiro':'&#36;',
  'Valores Antecipados - Duplicatas':'&#8987;',
};
const KPI_TONES = {
  'Entradas':'pos', 'Saídas':'neg', 'Saldo do período':'info',
  'Geração operacional':'purple', 'Empréstimos captados':'teal',
  'Antecipações':'warn', 'Recup. inadimplência':'crit', 'Custo financeiro':'purple',
  'Valores Antecipados - Duplicatas':'warn',
};
function kpiHtml(label, value, cls='', deltaHtml=''){
  const tone = KPI_TONES[label] || (cls==='pos'?'pos':cls==='neg'?'neg':'neutral');
  const icon = KPI_ICONS[label] || (cls==='pos'?'&#9650;':cls==='neg'?'&#9660;':'&#9679;');
  return `<div class="kpi kpi-${tone}"><div class="kpi-top"><span class="kpi-icon">${icon}</span><div class="kpi-label">${label}</div></div><div class="kpi-value ${cls}">${value}</div>${deltaHtml}</div>`;
}

/* ---------- 9.0 PAINEL EXECUTIVO ----------
   Os indicadores mais importantes do sistema, reunidos numa única tela: cards
   uniformes (mesma fonte, mesmo tamanho), organizados numa grade fixa por
   faixa de resolução — para que os mesmos cards sempre fiquem na mesma linha,
   sem depender de quanto texto cada valor tem. */
function renderPainelExecutivo(){
  const el = document.getElementById('sec-painel');
  const conj = r => r.conta+' '+r.historico;

  // caixa
  const entradas = sumBy(RECORDS, isEntrada), saidas = sumBy(RECORDS, isSaida);
  const saldo = entradas - saidas;
  const opEntradas = sumBy(RECORDS, r=>isEntrada(r)&&!isFinanceiro(r)), opSaidas = sumBy(RECORDS, r=>isSaida(r)&&!isFinanceiro(r));
  const geracaoOp = opEntradas - opSaidas;

  // dívida / financeiro
  const emprestimos = sumBy(RECORDS, r=>keywordMatch(conj(r),KW.emprestimo));
  const custoFin = sumBy(RECORDS, r=>keywordMatch(conj(r),KW.juros)) + sumBy(RECORDS, r=>keywordMatch(conj(r),KW.tarifas));
  const inadimplRecuperada = sumBy(RECORDS, r=>isEntrada(r)&&keywordMatch(r.conta+' '+r.historico+' '+r.fluxo,KW.inadimplencia));

  // receita / clientes
  const recsEnt = RECORDS.filter(isEntrada);
  const totalRecebido = sumBy(recsEnt, ()=>true);
  const clientesAtivos = new Set(recsEnt.map(r=>r.razao||r.cnpj).filter(Boolean)).size;
  const meses = sortedMonths(recsEnt);
  const lastM = meses[meses.length-1], prevM = meses[meses.length-2];
  const gCur = lastM? sumBy(recsEnt.filter(r=>monthKey(r.data)===lastM),()=>true):null;
  const gPrev = prevM? sumBy(recsEnt.filter(r=>monthKey(r.data)===prevM),()=>true):null;
  const cresc = growth(gCur,gPrev);
  const ticketMedio = recsEnt.length? totalRecebido/recsEnt.length : 0;

  // custos operacionais
  const opGroups = {
    'Matéria-prima': r=>keywordMatch(conj(r),KW.materiaPrima),
    'Folha/Salários': r=>keywordMatch(conj(r),KW.folha),
    'Fretes': r=>keywordMatch(conj(r),KW.fretes),
    'Tributos': r=>keywordMatch(conj(r),KW.tributos),
  };
  const opTotals = {}; for(const k in opGroups) opTotals[k] = sumBy(RECORDS.filter(isSaida), opGroups[k]);

  const naoClass = RECORDS.filter(isNaoClassificado);
  el.innerHTML = `
    ${noDataBanner()}
    ${naoClass.length? `<div class="banner">&#9888; ${naoClass.length} lançamento(s) não classificado(s) fora destes números — ver Diretoria &rarr; Lançamentos.</div>`:''}
    <div class="painel-grid">
      ${kpiHtml('Entradas', money(entradas),'pos', compareBadge(entradas, COMPARE_RECORDS, s=>sumBy(s,isEntrada), false))}
      ${kpiHtml('Saídas', money(saidas),'neg', compareBadge(saidas, COMPARE_RECORDS, s=>sumBy(s,isSaida), true))}
      ${kpiHtml('Saldo do período', money(saldo), saldo>=0?'pos':'neg', compareBadge(saldo, COMPARE_RECORDS, s=>sumBy(s,isEntrada)-sumBy(s,isSaida), false))}
      ${kpiHtml('Geração operacional', money(geracaoOp), geracaoOp>=0?'pos':'neg')}
      ${kpiHtml('Empréstimos captados', emprestimos? money(emprestimos):'—')}
      ${kpiHtml('Custo financeiro', custoFin? money(custoFin):'—')}
      ${kpiHtml('Recup. inadimplência', inadimplRecuperada? money(inadimplRecuperada):'—')}
      ${kpiHtml('Total recebido', money(totalRecebido),'pos')}
      ${kpiHtml('Clientes ativos', num(clientesAtivos))}
      ${kpiHtml('Crescimento (m/m)', cresc!=null?pct(cresc):'—', cresc>=0?'pos':'neg')}
      ${kpiHtml('Ticket médio', recsEnt.length? money(ticketMedio):'—')}
      ${kpiHtml('Matéria-prima', opTotals['Matéria-prima']?money(opTotals['Matéria-prima']):'—')}
      ${kpiHtml('Folha/Salários', opTotals['Folha/Salários']?money(opTotals['Folha/Salários']):'—')}
      ${kpiHtml('Fretes', opTotals['Fretes']?money(opTotals['Fretes']):'—')}
      ${kpiHtml('Tributos', opTotals['Tributos']?money(opTotals['Tributos']):'—')}
    </div>
  `;
}

/* Estado da tabela "Resultado mensal" mantido à parte (fora do innerHTML) para poder
   reconstruir a mesma tabela dentro do pop-up de ampliação e do documento de impressão,
   sem duplicar a lógica de agregação por mês. */
let DIR_RESULT = { months:[], recsByMonth:new Map(), entradas:0, saidas:0, saldo:0, detailCap:300 };
function computeDirResult(){
  const entradas = entradasLiquidas(RECORDS), saidas = sumBy(RECORDS, isSaida);
  const totalAntecip = sumBy(RECORDS, r=>keywordMatch(r.conta,KW.descontoDuplicata));
  const totalEmprest = sumBy(RECORDS, isEmprestimoEntrada);
  const months = sortedMonths(RECORDS);
  const recsByMonth = new Map(months.map(m=> [m, RECORDS.filter(r=>monthKey(r.data)===m).sort((a,b)=>(a.data?a.data.getTime():0)-(b.data?b.data.getTime():0))]));
  DIR_RESULT = { months, recsByMonth, entradas, saidas, totalAntecip, totalEmprest, saldo: entradas-saidas, detailCap:300 };
  return DIR_RESULT;
}
function dirResultRowsHTML(){
  const {months, recsByMonth, detailCap} = DIR_RESULT;
  if(!months.length) return `<tr><td colspan="6" style="text-align:center;color:var(--text-faint);padding:30px;">Sem dados no período.</td></tr>`;
  return months.map(m=>{
    const recs = recsByMonth.get(m);
    const desp = sumBy(recs, isSaida);
    const emprest = sumBy(recs, isEmprestimoEntrada);
    const rec = entradasLiquidas(recs) - emprest;
    const antecip = sumBy(recs, r=>keywordMatch(r.conta,KW.descontoDuplicata));
    const resultado = rec + emprest + antecip - desp;
    const shown = recs.slice(0, detailCap);
    const detailRows = shown.length
      ? shown.map(r=>`<tr class="data-row">
          <td>${dstr(r.data)}</td><td>${r.conta||'—'}</td>
          <td><span class="tag ${isEntrada(r)?'E':'S'}">${isEntrada(r)?'Entrada':'Saída'}</span></td>
          <td style="max-width:320px;overflow:hidden;text-overflow:ellipsis;">${r.historico||'—'}</td>
          <td style="color:${isEntrada(r)?'var(--pos)':'var(--neg)'};font-weight:600;">${moneyF(r.valor)}</td>
        </tr>`).join('')
      : `<tr><td colspan="6" style="text-align:center;color:var(--text-faint);padding:16px;">Nenhum lançamento neste mês.</td></tr>`;
    return `
    <tr class="data-row month-row" data-month="${m}">
      <td class="rt-mes rt-col-mes"><span class="row-expand-icon">&#9654;</span>${monthLabel(m)}</td>
      <td class="rt-col-receitas">${money(rec)}</td>
      <td class="rt-col-emprest">${emprest? money(emprest) : '—'}</td>
      <td class="rt-col-antecip">${antecip? money(antecip) : '—'}</td>
      <td class="rt-col-despesas">${money(desp)}</td>
      <td class="${resultado>=0?'rt-col-resultado-pos':'rt-col-resultado-neg'}">${money(resultado)}</td>
    </tr>
    <tr class="month-detail-row" data-month-detail="${m}">
      <td colspan="6">
        <div class="month-detail-wrap">
          <table class="month-detail-table"><thead><tr><th>Data</th><th>Categoria</th><th>Tipo</th><th>Histórico</th><th>Valor</th></tr></thead>
            <tbody>${detailRows}</tbody>
          </table>
          ${recs.length>detailCap? `<div class="month-detail-note">Mostrando os primeiros ${detailCap} de ${recs.length} lançamento(s) do mês. Use a página Lançamentos com o filtro de mês para ver todos.</div>` : ''}
        </div>
      </td>
    </tr>`;
  }).join('');
}
function dirResultTableFullHTML(){
  const { entradas, saidas, totalAntecip, totalEmprest, months } = DIR_RESULT;
  const resultadoTotal = entradas + totalAntecip - saidas;
  const foot = months.length ? `<tfoot><tr>

      <td>${money(entradas - totalEmprest)}</td>

  return `<div class="result-table-wrap"><table class="result-table"><thead><tr>

    </tr></thead><tbody>${dirResultRowsHTML()}</tbody>${foot}</table></div>`;

function wireDirResultTable(tbodyEl){
  if(!tbodyEl) return;
  const {months, recsByMonth, detailCap} = DIR_RESULT;
  tbodyEl.querySelectorAll('tr.month-row').forEach(tr=>{
    tr.addEventListener('click', ()=>{
      const m = tr.dataset.month;
      const detail = tbodyEl.querySelector(`tr.month-detail-row[data-month-detail="${m}"]`);
      const open = !tr.classList.contains('open');
      tr.classList.toggle('open', open);
      if(detail) detail.classList.toggle('open', open);
    });
  });
  months.forEach(m=>{
    const recs = recsByMonth.get(m).slice(0, detailCap);
    const detailTr = tbodyEl.querySelector(`tr.month-detail-row[data-month-detail="${m}"]`);
    if(!detailTr) return;
    [...detailTr.querySelectorAll('tbody tr')].forEach((tr,i)=>{
      if(recs[i]) tr.addEventListener('click', e=>{ e.stopPropagation(); openDetail(recs[i]); });
    });
  });
}

/* ---------- 9.3 RECEITAS ---------- */
function renderReceitas(){
  const el = document.getElementById('sec-receitas');
  const recs = RECORDS.filter(isEntrada);
  const total = sumBy(recs, ()=>true);
  const months = sortedMonths(recs);
  const media = months.length? total/months.length : 0;
  const maior = recs.reduce((m,r)=>Math.max(m,r.valor),0);
  const clientesAtivos = new Set(recs.map(r=>r.razao||r.cnpj).filter(Boolean)).size;
  const lastM = months[months.length-1], prevM = months[months.length-2];
  const gCur = lastM? sumBy(recs.filter(r=>monthKey(r.data)===lastM),()=>true):null;
  const gPrev = prevM? sumBy(recs.filter(r=>monthKey(r.data)===prevM),()=>true):null;
  const cresc = growth(gCur,gPrev);
  const inadimpl = sumBy(recs, r=>keywordMatch(r.conta+' '+r.historico+' '+r.fluxo,KW.inadimplencia));
  el.innerHTML = `
    <div class="kpi-grid">
      ${kpiHtml('Total recebido', money(total),'pos', compareBadge(total, COMPARE_RECORDS, s=>sumBy(s.filter(isEntrada),()=>true), false))}
      ${kpiHtml('Média mensal', money(media))}
      ${kpiHtml('Maior recebimento', money(maior))}
      ${kpiHtml('Clientes ativos', num(clientesAtivos))}
      ${kpiHtml('Crescimento (m/m)', cresc!=null?pct(cresc):'—', cresc>=0?'pos':'neg')}
      ${kpiHtml('Recup. inadimplência', inadimpl?money(inadimpl):'—')}
    </div>
    <div class="grid2">
      <div class="card"><div class="card-title">Receita mensal</div><div class="chart-wrap"><canvas id="rc_mensal"></canvas></div></div>
      <div class="card"><div class="card-title">Top clientes</div><div class="card-sub">Clique numa barra para filtrar o cliente</div><div class="chart-wrap"><canvas id="rc_top"></canvas></div></div>
    </div>
    <div class="grid3">
      <div class="card"><div class="card-title">Receita por empresa</div><div class="chart-wrap"><canvas id="rc_emp"></canvas></div></div>
      <div class="card"><div class="card-title">Receita por banco</div><div class="chart-wrap"><canvas id="rc_banco"></canvas></div></div>
      <div class="card"><div class="card-title">Normal x inadimplente</div><div class="chart-wrap"><canvas id="rc_inad"></canvas></div></div>
    </div>`;
  chartCard('rc_mensal', months.length>0, ()=>{
    const vals = months.map(m=> sumBy(recs.filter(r=>monthKey(r.data)===m),()=>true));
    mkChart('rc_mensal','bar',{labels:months.map(monthLabel), datasets:[{data:vals, backgroundColor:'#2E9E64', borderRadius:4}]},{},'mes',months);
  });
  const topCli = groupSum(recs, r=>r.razao||'Não identificado');
  chartCard('rc_top', topCli.size>0, ()=>{
    const arr=[...topCli.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8);
    mkChart('rc_top','bar',{labels:arr.map(a=>a[0].length>22?a[0].slice(0,22)+'…':a[0]), datasets:[{data:arr.map(a=>a[1]), backgroundColor:'#283ED6', borderRadius:4}]},{indexAxis:'y'},'razao',arr.map(a=>a[0]));
  });
  const empM = groupSum(recs, r=>empresaLabel(r.empresa));
  chartCard('rc_emp', empM.size>0, ()=>{
    const arr=[...empM.entries()];
    mkChart('rc_emp','doughnut',{labels:arr.map(a=>a[0]),datasets:[{data:arr.map(a=>a[1]),backgroundColor:PALETTE}]},{legend:true},'empresa',arr.map(a=>a[0]));
  });
  const bancoM = groupSum(recs, r=>r.banco||'Não informado');
  chartCard('rc_banco', bancoM.size>0, ()=>{
    const arr=[...bancoM.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6);
    mkChart('rc_banco','bar',{labels:arr.map(a=>a[0]),datasets:[{data:arr.map(a=>a[1]),backgroundColor:'#2C5C86',borderRadius:4}]},{},'banco',arr.map(a=>a[0]));
  });

    mkChart('rc_inad','doughnut',{labels:['Normal','Inadimplente/recuperado'],datasets:[{data:[normV,inadV],backgroundColor:['#2E9E64','#DB8B2B']}]},{legend:true});

    ]},{legend:true, scales:{y:{grid:{color:chartTheme().grid}}, y1:{position:'right', min:0,max:100, grid:{display:false}, ticks:{callback:v=>v+'%'}}}},'conta',arr.map(a=>a[0]));
  });
  chartCard('ds_evol', months.length>0, ()=>{
    const vals = months.map(m=> sumBy(recs.filter(r=>monthKey(r.data)===m),()=>true));
    mkChart('ds_evol','line',{labels:months.map(monthLabel), datasets:[{data:vals, borderColor:'#D64545', backgroundColor:'rgba(214,69,69,.12)', fill:true, tension:.3}]},{});
  });
  chartCard('ds_comp', catM.size>0, ()=>{
    const arr=[...catM.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6);
    mkChart('ds_comp','doughnut',{labels:arr.map(a=>a[0]),datasets:[{data:arr.map(a=>a[1]),backgroundColor:PALETTE}]},{legend:true},'conta',arr.map(a=>a[0]));
  });
  const empM = groupSum(recs, r=>empresaLabel(r.empresa));
  chartCard('ds_emp', empM.size>0, ()=>{
    const arr=[...empM.entries()];
    mkChart('ds_emp','bar',{labels:arr.map(a=>a[0]),datasets:[{data:arr.map(a=>a[1]),backgroundColor:'#5C6670',borderRadius:4}]},{},'empresa',arr.map(a=>a[0]));
  });

    const arr=[...catM.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8);
    mkChart('ds_cat','bar',{labels:arr.map(a=>a[0]),datasets:[{data:arr.map(a=>a[1]),backgroundColor:'#DB8B2B',borderRadius:4}]},{},'conta',arr.map(a=>a[0]));
  });
  const growEl = document.getElementById('ds_grow');
  if(months.length>=2){
    const cats = [...catM.keys()];
    const rows = cats.map(c=>{
      const cur = sumBy(recs.filter(r=>monthKey(r.data)===lastM && (r.conta||'Outros')===c),()=>true);
      const prev = sumBy(recs.filter(r=>monthKey(r.data)===prevM && (r.conta||'Outros')===c),()=>true);
      return {c, cur, prev, g: growth(cur,prev)};
    }).filter(r=>r.g!=null).sort((a,b)=>b.g-a.g).slice(0,6);
    growEl.innerHTML = rows.length ? `<table><thead><tr><th>Categoria</th><th>Mês anterior</th><th>Mês atual</th><th>Variação</th></tr></thead><tbody>${

    }</tbody></table>` : `<div class="empty"><div class="msg">Sem categorias comparáveis entre os dois últimos meses.</div></div>`;
  } else {
    growEl.innerHTML = `<div class="empty"><div class="msg">É necessário histórico de pelo menos 2 meses de despesas para calcular crescimento por categoria.</div></div>`;

/* ---------- 9.9 INDICADORES ---------- */
function renderIndicadores(){
  const el = document.getElementById('sec-indicadores');
  const receita = sumBy(RECORDS, isEntrada);
  const despesa = sumBy(RECORDS, isSaida);
  /* "receita" (todas as entradas) inclui empréstimos captados, antecipações e resgates de
     investimento — usar isso como denominador dos índices de custo (Matéria-prima/Receita etc.)
     infla artificialmente a receita sempre que há captação de dívida no período, subestimando os
     índices. receitaOp/despesaOp isolam o que é de fato operacional (a dimensão "visao" já existe
     no dado, só não era usada aqui). */
  const receitaOp = sumBy(RECORDS, r=>isEntrada(r)&&!isFinanceiro(r));
  const despesaOp = sumBy(RECORDS, r=>isSaida(r)&&!isFinanceiro(r));
  const conj = r=>r.conta+' '+r.historico;
  const mp = sumBy(RECORDS.filter(isSaida), r=>keywordMatch(conj(r),KW.materiaPrima));
  const emb = sumBy(RECORDS.filter(isSaida), r=>keywordMatch(conj(r),KW.embalagens));
  const fretes = sumBy(RECORDS.filter(isSaida), r=>keywordMatch(conj(r),KW.fretes));
  const folha = sumBy(RECORDS.filter(isSaida), r=>keywordMatch(conj(r),KW.folha));
  const tributos = sumBy(RECORDS.filter(isSaida), r=>keywordMatch(conj(r),KW.tributos));
  const juros = sumBy(RECORDS, r=>keywordMatch(conj(r),KW.juros));
  const tarifas = sumBy(RECORDS, r=>keywordMatch(conj(r),KW.tarifas));
  const antecip = sumBy(RECORDS, r=>keywordMatch(conj(r),KW.antecipacao));
  const emprest = sumBy(RECORDS.filter(isEntrada), r=>keywordMatch(conj(r),KW.emprestimo));
  const amort = sumBy(RECORDS.filter(isSaida), r=>keywordMatch(conj(r),KW.amortizacao));
  const geracaoOp = sumBy(RECORDS, r=>!isFinanceiro(r)?(isEntrada(r)?r.valor:-r.valor):0);
  const geracaoTotal = receita-despesa;
  const cliM = groupSum(RECORDS.filter(isEntrada), r=>r.razao||'Não identificado');
  const arrCli = [...cliM.entries()].sort((a,b)=>b[1]-a[1]);
  const top = n => receitaOp? arrCli.slice(0,n).reduce((a,x)=>a+x[1],0)/receitaOp : null;
  const inadimplRecuperada = sumBy(RECORDS, r=>isEntrada(r)&&keywordMatch(r.conta+' '+r.historico+' '+r.fluxo,KW.inadimplencia));
  const rows = [
    {grp:'Caixa', items:[['Geração operacional', geracaoOp?money(geracaoOp):'—'],['Geração total', money(geracaoTotal)],['Cobertura de despesas (caixa total)', despesa? pct(receita/despesa):'—']]},
    {grp:'Custos sobre receita operacional', items:[['Despesas op. / Receita op.', receitaOp?pct(despesaOp/receitaOp):'—'],['Matéria-prima / Receita op.', (receitaOp&&mp)?pct(mp/receitaOp):'—'],['Embalagens / Receita op.', (receitaOp&&emb)?pct(emb/receitaOp):'—'],['Fretes / Receita op.', (receitaOp&&fretes)?pct(fretes/receitaOp):'—'],['Folha / Receita op.', (receitaOp&&folha)?pct(folha/receitaOp):'—'],['Tributos / Receita op.', (receitaOp&&tributos)?pct(tributos/receitaOp):'—']]},
    {grp:'Financeiro', items:[['Juros', juros?money(juros):'—'],['Tarifas', tarifas?money(tarifas):'—'],['Antecipações', antecip?money(antecip):'—'],['Empréstimos', emprest?money(emprest):'—'],['Amortizações', amort?money(amort):'—']]},
    {grp:'Concentração de clientes', items:[['Top 5', top(5)!=null?pct(top(5)):'—'],['Top 10', top(10)!=null?pct(top(10)):'—'],['Top 20', top(20)!=null?pct(top(20)):'—']]},
    {grp:'Estrutura de capital', items:[['Capital de giro (saldo período)', money(receita-despesa)],['Dependência de empréstimos', receita? pct(emprest/receita):'—'],['Dependência de antecipação', receita? pct(antecip/receita):'—'],['Recuperação de inadimplência', inadimplRecuperada?money(inadimplRecuperada):'—']]},
  ];
  el.innerHTML = `<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));">
    ${rows.map(g=>`<div class="card"><div class="card-title">${g.grp}</div><table><tbody>${g.items.map(i=>`<tr><td>${i[0]}</td><td style="text-align:right;font-weight:600;">${i[1]}</td></tr>`).join('')}</tbody></table></div>`).join('')}
  </div>`;
}

/* ---------- 9.10 ALERTAS ---------- */
function buildAlerts(){
  const alerts = [];
  const months = sortedMonths(RECORDS);
  const conj = r=>r.conta+' '+r.historico;
  const naoClass = RECORDS.filter(isNaoClassificado);
  if(naoClass.length){
    const v = naoClass.reduce((a,r)=>a+r.valor,0);
    alerts.push({level:'warn', title:'Lançamentos não classificados', desc:`${naoClass.length} lançamento(s) somando ${money(v)} não têm TIPO nem NOME_CONTA_GRUPO1 reconhecíveis como Entrada/Saída e estão fora de todos os KPIs de caixa. Confira a origem desses dados.`});
  }
  if(months.length){
    const last = months[months.length-1];
    const rs = RECORDS.filter(r=>monthKey(r.data)===last && !isFinanceiro(r));
    const net = sumBy(rs,isEntrada)-sumBy(rs,isSaida);
    if(net<0) alerts.push({level:'crit', title:'Caixa operacional negativo', desc:`No mês de ${monthLabel(last)}, as saídas operacionais superaram as entradas em ${money(Math.abs(net))}.`});
  }
  if(months.length>=2){
    const last = months[months.length-1], prev = months[months.length-2];
    const cur = sumBy(RECORDS.filter(r=>monthKey(r.data)===last), isEntrada);
    const prv = sumBy(RECORDS.filter(r=>monthKey(r.data)===prev), isEntrada);
    const g = growth(cur,prv);
    if(g!=null){
      if(g<=-0.2) alerts.push({level: g<=-0.4?'crit':'warn', title:'Queda nos recebimentos', desc:`A receita de ${monthLabel(last)} caiu ${pct(Math.abs(g))} em relação a ${monthLabel(prev)}.`});
      if(g>=0.3) alerts.push({level:'warn', title:'Aumento anormal de receita', desc:`A receita de ${monthLabel(last)} subiu ${pct(g)} em relação a ${monthLabel(prev)} — vale confirmar se é recorrente ou pontual.`});
    }
    const curD = sumBy(RECORDS.filter(r=>monthKey(r.data)===last), isSaida);
    const prvD = sumBy(RECORDS.filter(r=>monthKey(r.data)===prev), isSaida);
    const gD = growth(curD,prvD);
    if(gD!=null && gD>=0.3) alerts.push({level: gD>=0.6?'crit':'warn', title:'Aumento anormal de despesas', desc:`As despesas de ${monthLabel(last)} subiram ${pct(gD)} em relação a ${monthLabel(prev)}.`});
  }
  if(months.length>=3){
    const last = months[months.length-1];
    const cats = [...new Set(RECORDS.filter(isSaida).map(r=>r.conta||'Outros'))];
    cats.forEach(c=>{
      const hist = months.slice(0,-1).map(m=> sumBy(RECORDS.filter(r=>monthKey(r.data)===m && isSaida(r) && (r.conta||'Outros')===c),()=>true));
      if(!hist.length) return;
      const mean = hist.reduce((a,b)=>a+b,0)/hist.length;
      const cur = sumBy(RECORDS.filter(r=>monthKey(r.data)===last && isSaida(r) && (r.conta||'Outros')===c),()=>true);
      if(mean>0 && cur > mean*1.5) alerts.push({level: cur>mean*2?'crit':'warn', title:`Despesa acima da média — ${c}`, desc:`${monthLabel(last)} registrou ${money(cur)}, ${pct((cur-mean)/mean)} acima da média dos meses anteriores (${money(mean)}).`});
    });
  }
  const cliM = groupSum(RECORDS.filter(isEntrada), r=>r.razao||'Não identificado');
  const receitaTotal = sumBy(RECORDS,isEntrada);
  if(cliM.size && receitaTotal){
    const arr=[...cliM.entries()].sort((a,b)=>b[1]-a[1]);
    const top5pct = arr.slice(0,5).reduce((a,x)=>a+x[1],0)/receitaTotal;
    if(top5pct>=0.4) alerts.push({level: top5pct>=0.6?'crit':'warn', title:'Concentração de clientes', desc:`Os 5 maiores clientes respondem por ${pct(top5pct)} da receita do período.`});
  }
  if(months.length>=2){
    const last=months[months.length-1], prev=months[months.length-2];
    const curI = sumBy(RECORDS.filter(r=>monthKey(r.data)===last && keywordMatch(r.conta+' '+r.historico+' '+r.fluxo, KW.inadimplencia)),()=>true);
    const prvI = sumBy(RECORDS.filter(r=>monthKey(r.data)===prev && keywordMatch(r.conta+' '+r.historico+' '+r.fluxo, KW.inadimplencia)),()=>true);
    if(prvI>0 && curI>prvI*1.2) alerts.push({level:'warn', title:'Aumento de inadimplência', desc:`Os valores ligados a inadimplência subiram de ${money(prvI)} para ${money(curI)} entre ${monthLabel(prev)} e ${monthLabel(last)}.`});
  }
  if(months.length>=2){
    const last=months[months.length-1], prev=months[months.length-2];
    const curC = sumBy(RECORDS.filter(r=>monthKey(r.data)===last && (keywordMatch(conj(r),KW.juros)||keywordMatch(conj(r),KW.tarifas))),()=>true);
    const prvC = sumBy(RECORDS.filter(r=>monthKey(r.data)===prev && (keywordMatch(conj(r),KW.juros)||keywordMatch(conj(r),KW.tarifas))),()=>true);
    if(prvC>0 && curC>prvC*1.2) alerts.push({level:'warn', title:'Aumento de custo financeiro', desc:`Juros e tarifas passaram de ${money(prvC)} em ${monthLabel(prev)} para ${money(curC)} em ${monthLabel(last)}.`});
  }
  if(months.length>=2){
    const last=months[months.length-1], prev=months[months.length-2];
    const curP = sumBy(RECORDS.filter(r=>monthKey(r.data)===last && keywordMatch(conj(r),KW.perdas)),()=>true);
    const prvP = sumBy(RECORDS.filter(r=>monthKey(r.data)===prev && keywordMatch(conj(r),KW.perdas)),()=>true);
    if(prvP>0 && curP>prvP*1.2) alerts.push({level:'warn', title:'Aumento de perdas', desc:`Perdas passaram de ${money(prvP)} em ${monthLabel(prev)} para ${money(curP)} em ${monthLabel(last)}.`});
  }
  const emprest = sumBy(RECORDS.filter(isEntrada), r=>keywordMatch(conj(r),KW.emprestimo));
  const antecip = sumBy(RECORDS, r=>keywordMatch(conj(r),KW.antecipacao));
  if(receitaTotal && emprest && emprest/receitaTotal>=0.2) alerts.push({level: emprest/receitaTotal>=0.4?'crit':'warn', title:'Dependência de empréstimos', desc:`Empréstimos representam ${pct(emprest/receitaTotal)} das entradas do período.`});
  if(receitaTotal && antecip && antecip/receitaTotal>=0.2) alerts.push({level: antecip/receitaTotal>=0.4?'crit':'warn', title:'Dependência de antecipação', desc:`Antecipações representam ${pct(antecip/receitaTotal)} das entradas do período.`});
  return alerts;
}
function buildRadarSummary(){
  const alerts = buildAlerts();
  const crit = alerts.filter(a=>a.level==='crit').length, warn = alerts.filter(a=>a.level==='warn').length;
  if(!alerts.length) return `<div class="badge ok">&#9679; Normal</div><div class="radar-note">Nenhuma exceção relevante identificada com as regras do radar no período e filtro atual.</div>`;
  return `<div style="display:flex;gap:10px;margin-bottom:10px;">${crit?`<div class="badge crit">&#9679; ${crit} crítico(s)</div>`:''}${warn?`<div class="badge warn">&#9679; ${warn} atenção</div>`:''}</div>
  <div class="alert-list">${alerts.slice(0,3).map(a=>`<div class="alert-item ${a.level}"><div class="lvl">${a.level==='crit'?'🔴':'🟡'}</div><div class="body"><b>${a.title}</b><span>${a.desc}</span></div></div>`).join('')}</div>
  ${alerts.length>3?`<div class="radar-note">+ ${alerts.length-3} outro(s) — veja a página Alertas.</div>`:''}`;
}
function renderAlertas(){
  const el = document.getElementById('sec-alertas');
  const alerts = buildAlerts();
  el.innerHTML = `
    <div class="banner">Radar automático baseado em regras estatísticas simples (médias, variações mês a mês e concentração). Ele <b>nunca afirma fraude ou erro</b> — apenas aponta desvios que merecem checagem manual.</div>
    ${alerts.length? `<div class="alert-list">${alerts.sort((a,b)=> (a.level==='crit'?0:1)-(b.level==='crit'?0:1)).map(a=>`
      <div class="alert-item ${a.level}"><div class="lvl">${a.level==='crit'?'🔴':a.level==='warn'?'🟡':'🟢'}</div>
      <div class="body"><b>${a.title}</b><span>${a.desc}</span></div></div>`).join('')}</div>`
    : `<div class="empty" style="min-height:220px;"><div class="glyph">🟢</div><div class="msg">Nenhuma exceção identificada pelo radar no período e filtro selecionados.</div></div>`}
  `;
}

/* ---------- 9.10b INSIGHTS FINANCEIROS ----------
   Observações automáticas geradas por regras sobre os dados já carregados — nunca por um modelo
   que "inventa" texto. Cada insight cita os números que o sustentam. Quando o insight aponta uma
   variação (ex.: uma categoria de despesa disparou) sem que os dados digam POR QUE isso aconteceu,
   o texto é encerrado com "Possível causa — necessita investigação." em vez de arriscar uma causa
   que a base não comprova (ex.: nunca dizer "aumentou porque a empresa contratou mais gente" sem
   um dado de folha que sustente isso). */
function buildInsights(){
  const insights = [];
  const months = sortedMonths(RECORDS);
  const conj = r=>r.conta+' '+r.historico;
  const NEEDS_INVESTIGATION = 'Possível causa — necessita investigação.';

  // 1) Tendência da geração operacional (janela de até 3 meses vs. janela anterior de mesmo tamanho)
  if(months.length>=4){
    const win = Math.min(3, Math.floor(months.length/2));
    const lastWin = months.slice(-win);
    const prevWin = months.slice(-2*win, -win);
    const geracaoJanela = ms => { const rs = RECORDS.filter(r=>ms.includes(monthKey(r.data)) && !isFinanceiro(r)); return sumBy(rs,isEntrada)-sumBy(rs,isSaida); };
    const curG = geracaoJanela(lastWin), prevG = geracaoJanela(prevWin);
    const g = growth(curG, prevG);
    if(g!=null && Math.abs(g)>=0.05){
      const melhorou = g>0;
      insights.push({level: melhorou?'ok':'warn',
        title: melhorou? 'Geração operacional melhorou nos últimos períodos' : 'Geração operacional piorou nos últimos períodos',
        desc: `Nos últimos ${win} mês(es) a geração operacional foi de ${money(curG)}, ante ${money(prevG)} nos ${win} mês(es) anteriores — variação de ${pct(Math.abs(g))}.`});
    }
  }

  // 2) Concentração de clientes (top 5 sobre receita operacional)
  const receitaOp = sumBy(RECORDS, r=>isEntrada(r)&&!isFinanceiro(r));
  const cliM = groupSum(RECORDS.filter(isEntrada), r=>r.razao||'Não identificado');
  const arrCli = [...cliM.entries()].sort((a,b)=>b[1]-a[1]);
  const top5pct = receitaOp? arrCli.slice(0,5).reduce((a,x)=>a+x[1],0)/receitaOp : null;
  if(top5pct!=null && top5pct>=0.4){
    insights.push({level: top5pct>=0.6?'crit':'warn', title:'Existe concentração relevante nos maiores clientes',
      desc:`Os 5 maiores clientes/fornecedores respondem por ${pct(top5pct)} da receita operacional do período (base: ${arrCli.length} cliente(s) identificado(s)).`});
  }

  // 3) Categoria de despesa com crescimento significativo mês a mês
  if(months.length>=2){
    const last = months[months.length-1], prev = months[months.length-2];
    const despesaMesUltimo = sumBy(RECORDS.filter(r=>monthKey(r.data)===last && isSaida(r)),()=>true) || 1;
    const cats = [...new Set(RECORDS.filter(isSaida).map(r=>r.conta||'Outros'))];
    let worst = null;
    cats.forEach(c=>{
      const cur = sumBy(RECORDS.filter(r=>monthKey(r.data)===last && isSaida(r) && (r.conta||'Outros')===c),()=>true);
      const prv = sumBy(RECORDS.filter(r=>monthKey(r.data)===prev && isSaida(r) && (r.conta||'Outros')===c),()=>true);
      if(prv>0 && cur>0){
        const g = growth(cur,prv);
        const relevante = cur >= 0.03*despesaMesUltimo; // ignora categorias muito pequenas (ruído)
        if(g!=null && g>=0.3 && relevante && (!worst || g>worst.g)) worst = {c,g,cur,prv};
      }
    });
    if(worst){
      insights.push({level:'warn', title:'Despesas de uma categoria apresentaram crescimento significativo',
        desc:`A categoria "${worst.c}" passou de ${money(worst.prv)} em ${monthLabel(prev)} para ${money(worst.cur)} em ${monthLabel(last)}, alta de ${pct(worst.g)}. ${NEEDS_INVESTIGATION}`});
    }
  }

  // 4) Uso de antecipação
  const antecip = sumBy(RECORDS, r=>keywordMatch(conj(r),KW.antecipacao));
  if(receitaOp && antecip/receitaOp>=0.15){
    insights.push({level: antecip/receitaOp>=0.3?'crit':'warn', title:'A utilização de antecipação merece acompanhamento',
      desc:`Antecipações somaram ${money(antecip)} no período, equivalentes a ${pct(antecip/receitaOp)} da receita operacional.`});
  }

  // 5) Dependência de empréstimos
  const emprest = sumBy(RECORDS.filter(isEntrada), r=>keywordMatch(conj(r),KW.emprestimo));
  if(receitaOp && emprest/receitaOp>=0.2){
    insights.push({level: emprest/receitaOp>=0.4?'crit':'warn', title:'Dependência de captação de empréstimos',
      desc:`Empréstimos captados somaram ${money(emprest)} no período, equivalentes a ${pct(emprest/receitaOp)} da receita operacional.`});
  }

  // 6) Custo financeiro (juros + tarifas) em alta mês a mês
  if(months.length>=2){
    const last=months[months.length-1], prev=months[months.length-2];
    const curC = sumBy(RECORDS.filter(r=>monthKey(r.data)===last && (keywordMatch(conj(r),KW.juros)||keywordMatch(conj(r),KW.tarifas))),()=>true);
    const prvC = sumBy(RECORDS.filter(r=>monthKey(r.data)===prev && (keywordMatch(conj(r),KW.juros)||keywordMatch(conj(r),KW.tarifas))),()=>true);
    const g = growth(curC,prvC);
    if(prvC>0 && g!=null && g>=0.2){
      insights.push({level:'warn', title:'Custo financeiro em alta',
        desc:`Juros e tarifas passaram de ${money(prvC)} em ${monthLabel(prev)} para ${money(curC)} em ${monthLabel(last)}, alta de ${pct(g)}. ${NEEDS_INVESTIGATION}`});
    }
  }

  // 7) Perdas em alta mês a mês
  if(months.length>=2){
    const last=months[months.length-1], prev=months[months.length-2];
    const curP = sumBy(RECORDS.filter(r=>monthKey(r.data)===last && keywordMatch(conj(r),KW.perdas)),()=>true);
    const prvP = sumBy(RECORDS.filter(r=>monthKey(r.data)===prev && keywordMatch(conj(r),KW.perdas)),()=>true);
    const g = growth(curP,prvP);
    if(prvP>0 && g!=null && g>=0.2){
      insights.push({level:'warn', title:'Perdas em alta',
        desc:`Perdas passaram de ${money(prvP)} em ${monthLabel(prev)} para ${money(curP)} em ${monthLabel(last)}, alta de ${pct(g)}. ${NEEDS_INVESTIGATION}`});
    }
  }

  // 8) Caixa operacional negativo no último mês
  if(months.length){
    const last = months[months.length-1];
    const rs = RECORDS.filter(r=>monthKey(r.data)===last && !isFinanceiro(r));
    const net = sumBy(rs,isEntrada)-sumBy(rs,isSaida);
    if(net<0){
      insights.push({level:'crit', title:'Caixa operacional negativo no último mês',
        desc:`Em ${monthLabel(last)}, as saídas operacionais superaram as entradas em ${money(Math.abs(net))}. ${NEEDS_INVESTIGATION}`});
    }
  }

  // 9) Lançamentos não classificados (mesmo alerta do radar, também relevante como insight de qualidade de dado)
  const naoClass = RECORDS.filter(isNaoClassificado);
  if(naoClass.length){
    insights.push({level:'warn', title:'Qualidade de dados: lançamentos não classificados',
      desc:`${naoClass.length} lançamento(s) somando ${money(naoClass.reduce((a,r)=>a+r.valor,0))} não têm Entrada/Saída identificável e estão fora dos KPIs de caixa.`});
  }

  return insights;
}
function buildInsightsHtml(limit){
  const insights = buildInsights().sort((a,b)=> ({crit:0,warn:1,ok:2}[a.level]-{crit:0,warn:1,ok:2}[b.level]));
  if(!insights.length) return `<div class="badge ok">&#9679; Sem padrões relevantes</div><div class="radar-note">Nenhuma observação sustentada pelas regras atuais no período e filtro selecionados.</div>`;
  const shown = limit? insights.slice(0,limit) : insights;
  const rest = limit? insights.length-shown.length : 0;
  return `<div class="alert-list">${shown.map(i=>`
    <div class="alert-item insight-item ${i.level}"><div class="lvl">${i.level==='crit'?'🔴':i.level==='warn'?'🟡':'🟢'}</div>
    <div class="body"><b>${i.title}</b><span>${i.desc}</span></div></div>`).join('')}</div>
    ${rest>0? `<div class="radar-note">+ ${rest} outro(s) — veja a página Insights Financeiros.</div>` : ''}`;
}
function renderInsights(){
  const el = document.getElementById('sec-insights');
  el.innerHTML = `
    <div class="banner">Observações geradas automaticamente por regras sobre os dados do período e filtro atuais (tendências, concentração, variações mês a mês). O painel <b>nunca atribui uma causa</b> que os dados não comprovem — quando um padrão é identificado sem uma explicação sustentada pela base, o texto traz "Possível causa — necessita investigação." em vez de arriscar um palpite.</div>
    <div id="ins_list"></div>
  `;
  document.getElementById('ins_list').innerHTML = buildInsightsHtml(null);
}

/* ---------- 9.11 LANÇAMENTOS ---------- */
function renderLancamentos(){
  const el = document.getElementById('sec-lancamentos');
  el.innerHTML = `
    <div class="table-toolbar">
      <input class="filter" id="lan_search" placeholder="Pesquisar histórico, cliente ou CNPJ..." style="min-width:260px;">
      <span style="color:var(--text-faint);font-size:12px;margin-left:auto;" id="lan_count"></span>
    </div>
    <div class="table-scroll">
      <table id="lan_table">
        <thead><tr>
          <th data-k="data">Data</th><th data-k="empresa">Empresa</th><th data-k="banco">Banco/Fluxo</th>
          <th data-k="grupo1">Natureza</th><th data-k="conta">Categoria</th><th data-k="tipo">Tipo</th>
          <th data-k="historico">Histórico</th><th data-k="razao">Cliente/Fornecedor</th><th data-k="cnpj">CNPJ/CPF</th>
          <th data-k="valor">Valor</th><th data-k="origem">Origem</th><th data-k="codigo">Código</th><th data-k="duplicata">Duplicata</th>
        </tr></thead>
        <tbody id="lan_tbody"></tbody>
      </table>
    </div>
    <div class="pagination">
      <span id="lan_pageinfo"></span>
      <div class="pg-btns"><button id="lan_prev">&#8592;</button><button id="lan_next">&#8594;</button></div>
    </div>
  `;
  document.getElementById('lan_search').value = lanState.search;
  document.getElementById('lan_search').addEventListener('input', e=>{lanState.search=e.target.value; lanState.page=1; drawLancamentos();});
  document.querySelectorAll('#lan_table th').forEach(th=>{
    th.addEventListener('click', ()=>{
      const k = th.dataset.k;
      if(lanState.sortKey===k) lanState.sortDir = lanState.sortDir==='asc'?'desc':'asc';
      else { lanState.sortKey=k; lanState.sortDir='desc'; }
      drawLancamentos();
    });
  });
  document.getElementById('lan_prev').addEventListener('click', ()=>{ if(lanState.page>1){lanState.page--; drawLancamentos();} });
  document.getElementById('lan_next').addEventListener('click', ()=>{ lanState.page++; drawLancamentos(); });
  drawLancamentos();
}
function drawLancamentos(){
  let recs = RECORDS.slice();
  if(lanState.search){
    const q = norm(lanState.search);
    recs = recs.filter(r=> norm(r.historico).includes(q) || norm(r.razao).includes(q) || norm(r.cnpj).includes(q));
  }
  const k = lanState.sortKey;
  recs.sort((a,b)=>{
    let va=a[k], vb=b[k];
    if(k==='data'){ va=va?va.getTime():0; vb=vb?vb.getTime():0; }
    else if(k==='valor'){ va=va||0; vb=vb||0; }
    else { va=norm(va); vb=norm(vb); }
    if(va<vb) return lanState.sortDir==='asc'?-1:1;
    if(va>vb) return lanState.sortDir==='asc'?1:-1;
    return 0;
  });
  document.querySelectorAll('#lan_table th').forEach(th=> th.classList.toggle('sorted', th.dataset.k===k));
  const total = recs.length;
  const pages = Math.max(1, Math.ceil(total/lanState.pageSize));
  if(lanState.page>pages) lanState.page=pages;
  const start = (lanState.page-1)*lanState.pageSize;
  const pageRecs = recs.slice(start, start+lanState.pageSize);
  document.getElementById('lan_count').textContent = `${total.toLocaleString('pt-BR')} lançamento(s)`;
  document.getElementById('lan_pageinfo').textContent = `Página ${lanState.page} de ${pages}`;
  document.getElementById('lan_prev').disabled = lanState.page<=1;
  document.getElementById('lan_next').disabled = lanState.page>=pages;
  const tbody = document.getElementById('lan_tbody');
  tbody.innerHTML = pageRecs.map((r)=>`
    <tr class="data-row">
      <td>${dstr(r.data)}</td><td>${empresaLabel(r.empresa)}</td><td>${r.banco||'—'}</td>
      <td>${r.grupo1||'—'}</td><td>${r.conta||'—'}</td>
      <td><span class="tag ${isEntrada(r)?'E':'S'}">${isEntrada(r)?'Entrada':'Saída'}</span></td>
      <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;">${r.historico||'—'}</td>
      <td>${r.razao||'—'}</td><td>${r.cnpj||'—'}</td>
      <td style="color:${isEntrada(r)?'var(--pos)':'var(--neg)'};font-weight:600;">${moneyF(r.valor)}</td>
      <td>${r.origem||'—'}</td><td>${r.codigo||'—'}</td><td>${r.duplicata||'—'}</td>
    </tr>`).join('') || `<tr><td colspan="13" style="text-align:center;color:var(--text-faint);padding:30px;">Nenhum lançamento encontrado.</td></tr>`;
  [...tbody.querySelectorAll('tr.data-row')].forEach((tr,i)=>{ tr.onclick = ()=> openDetail(pageRecs[i]); });
}
function openDetail(r){
  if(!r) return;
  const fields = [
    ['Data', dstr(r.data)], ['Empresa', empresaLabel(r.empresa)], ['Banco/Fluxo', r.banco||'—'],
    ['Natureza', r.grupo1||'—'], ['Subgrupo', r.grupo2||'—'], ['Categoria', r.conta||'—'],
    ['Tipo', isEntrada(r)?'Entrada':'Saída'], ['Histórico', r.historico||'—'],
    ['Cliente/Fornecedor', r.razao||'—'], ['CNPJ/CPF', r.cnpj||'—'],
    ['Valor', moneyF(r.valor)], ['Origem', r.origem||'—'], ['Código', r.codigo||'—'], ['Duplicata', r.duplicata||'—'],
  ];
  document.getElementById('modalBody').innerHTML = fields.map(f=>`<div class="row"><span>${f[0]}</span><span>${f[1]}</span></div>`).join('');
  document.getElementById('modalBg').classList.add('active');
}

/* ============================================================
   10. DRILL-DOWN COMPONENT
   ============================================================ */
function renderDrill(containerId, dims, baseRecords){
  if(!DRILL_STATE[containerId]) DRILL_STATE[containerId] = {path:[]};
  drawDrill(containerId, dims, baseRecords);
}
function drawDrill(containerId, dims, baseRecords){
  const state = DRILL_STATE[containerId];
  const el = document.getElementById(containerId);
  if(!el) return;
  // filter baseRecords according to path selections
  let recs = baseRecords;
  state.path.forEach((step, i)=>{ recs = recs.filter(r=> dims[i].key(r) === step); });

  const crumbs = [`<span class="crumb${state.path.length===0?' current':''}" data-lvl="0">Todos</span>`];
  state.path.forEach((step,i)=>{
    crumbs.push(`<span class="crumb-sep">›</span>`);
    crumbs.push(`<span class="crumb${i===state.path.length-1?' current':''}" data-lvl="${i+1}">${step}</span>`);
  });

  let bodyHtml;
  if(state.path.length < dims.length){
    const dim = dims[state.path.length];
    const grouped = groupSum(recs, dim.key);
    const arr = [...grouped.entries()].sort((a,b)=>b[1]-a[1]);
    const maxV = arr.length? arr[0][1] : 0;
    bodyHtml = arr.length ? `<table><thead><tr><th>${dim.label}</th><th>Valor</th><th># lançamentos</th></tr></thead><tbody>
      ${arr.map(a=>{
        const cnt = recs.filter(r=>dim.key(r)===a[0]).length;
        const w = maxV? Math.max(4,Math.round(a[1]/maxV*100)) : 0;
        return `<tr class="drill-row" data-val="${encodeURIComponent(a[0])}"><td><span class="drill-bar"><i style="width:${w}%"></i></span>${a[0]}</td><td>${money(a[1])}</td><td>${cnt}</td></tr>`;
      }).join('')}
    </tbody></table>` : `<div class="empty"><div class="msg">Sem dados neste nível.</div></div>`;
  } else {
    bodyHtml = recs.length ? `<div class="table-scroll" style="max-height:320px;"><table><thead><tr><th>Data</th><th>Histórico</th><th>Cliente/Fornecedor</th><th>Valor</th></tr></thead><tbody>
      ${recs.slice(0,300).map((r,i)=>`<tr class="data-row" data-idx="${i}"><td>${dstr(r.data)}</td><td>${r.historico||'—'}</td><td>${r.razao||'—'}</td><td style="color:${isEntrada(r)?'var(--pos)':'var(--neg)'};font-weight:600;">${moneyF(r.valor)}</td></tr>`).join('')}
    </tbody></table></div>${recs.length>300?`<div class="radar-note">Mostrando os primeiros 300 de ${recs.length} lançamentos.</div>`:''}` : `<div class="empty"><div class="msg">Nenhum lançamento neste nível.</div></div>`;
  }

  el.innerHTML = `<div class="breadcrumb">${crumbs.join('')}</div>${bodyHtml}`;

  el.querySelectorAll('.crumb').forEach(c=>{
    c.addEventListener('click', ()=>{
      const lvl = parseInt(c.dataset.lvl,10);
      state.path = state.path.slice(0, lvl);
      drawDrill(containerId, dims, baseRecords);
    });
  });
  el.querySelectorAll('.drill-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      state.path.push(decodeURIComponent(row.dataset.val));
      drawDrill(containerId, dims, baseRecords);
    });
  });
  el.querySelectorAll('tr.data-row[data-idx]').forEach(tr=>{
    tr.addEventListener('click', ()=> openDetail(recs[parseInt(tr.dataset.idx,10)]));
  });
}
