<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Financeiro</title>
<!--
  Bibliotecas locais com fallback automático por várias CDNs.
  ==========================================================
  As fontes usam a pilha padrão do sistema operacional (nada de Google Fonts).
  Chart.js (gráficos) e SheetJS/xlsx (leitura de planilhas) são carregados
  PRIMEIRO de arquivos locais na pasta "vendor/", ao lado deste HTML — se você
  colocar os arquivos lá, o painel abre 100% offline, sem nenhuma chamada de
  rede. Se os arquivos não estiverem em "vendor/" (ex.: você acabou de baixar
  o HTML e ainda não configurou isso), o próprio <script> cai automaticamente
  para a internet, tentando em sequência 3 CDNs diferentes (cdnjs, jsDelivr e
  unpkg) — assim, se uma delas estiver bloqueada ou fora do ar na sua rede
  (bloqueador de anúncios, firewall corporativo, antivírus etc.), as outras
  ainda funcionam. Para deixar 100% offline, salve nesta mesma pasta:
    vendor/chart.umd.min.js   — Chart.js 4.4.4  (https://www.chartjs.org)
    vendor/xlsx.full.min.js   — SheetJS/xlsx 0.18.5 (https://sheetjs.com)
-->
<!-- Configuração compartilhada (gerada pelo painel em "Parametrizar Categorias"); se o arquivo não existir, é ignorado. -->
<script src="painel_config.js"></script>
<script>
/* Lista de CDNs alternativas para cada biblioteca. Se o arquivo local
   falhar, tentamos a primeira; se essa também falhar (bloqueada, offline,
   CDN fora do ar), tentamos a próxima, e assim por diante. */
window.__libSources = {
  chart: [
    'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js',
    'https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js',
    'https://unpkg.com/chart.js@4.4.4/dist/chart.umd.min.js'
  ],
  xlsx: [
    'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
    'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'
  ]
};

/* Carrega uma lista de URLs em sequência (uma <script> por vez) até que
   window[globalName] exista, ou até esgotar as opções. */
window.__loadScriptChain = function(urls, globalName, onDone){
  let i = -1;
  function next(){
    i++;
    if(window[globalName]){ onDone(true); return; }
    if(i >= urls.length){ onDone(false); return; }
    const s = document.createElement('script');
    s.src = urls[i];
    s.onload = function(){ onDone(true); };
    s.onerror = next;
    document.head.appendChild(s);
  }
  next();
};

/* __ensureLib garante que a biblioteca esteja disponível: primeiro tenta o
   arquivo local em vendor/, depois percorre a cadeia de CDNs até uma
   funcionar (ou esgotar as opções). Aguarda até ~20s no total antes de
   desistir, o que dá tempo suficiente mesmo em conexões lentas. */
window.__ensureLib = function(globalName, cdnList){
  if(window[globalName]) return Promise.resolve(true);
  return new Promise(function(resolve){
    const localPath = globalName === 'Chart' ? './vendor/chart.umd.min.js' : './vendor/xlsx.full.min.js';
    const localScript = document.createElement('script');
    let settled = false;
    const finish = function(ok){ if(!settled){ settled = true; resolve(ok); } };
    localScript.src = localPath;
    localScript.onload = function(){ finish(!!window[globalName]); };
    localScript.onerror = function(){
      window.__loadScriptChain(cdnList || [], globalName, finish);
    };
    document.head.appendChild(localScript);
    /* limite de segurança: ~20s (200 tentativas de 100ms) */
    let tries = 0;
    const t = setInterval(function(){
      tries++;
      if(window[globalName]){ clearInterval(t); finish(true); }
      else if(settled){ clearInterval(t); }
      else if(tries>200){ clearInterval(t); finish(false); }
    }, 100);
  });
};
</script>
<style>
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
  /* ---------- identidade visual: azul como cor primária ---------- */
  --primary:#283ED6;
  --primary-600:#2234BE;
  --primary-700:#1B2A9E;
  --primary-900:#141F63;
  --secondary:#2E9EFA;
  --sidebar-top:#2E4CE0;
  --sidebar-mid:#243BC9;
  --sidebar-bottom:#141F63;
  --bg:#0A1626;
  --surface:#0F2036;
  --surface-2:#152B46;
  --border:#33404B;
  --border-soft:#242E38;
  --text:#EEF2F5;
  --text-dim:#8D98A3;
  --text-faint:#5C6670;
  --gold:#3654E8;
  --gold-soft:#16234F;
  --pos:#2E9E64;
  --pos-soft:#12281E;
  --neg:#D64545;
  --neg-soft:#331616;
  --warn:#DB8B2B;
  --warn-soft:#332512;
  --crit:#D64545;
  --info:#3E8FA0;
  --info-soft:#0F2A30;
  --purple:#9B87F0;
  --purple-soft:#241B44;
  --teal:#22B8AC;
  --teal-soft:#0F2E2C;
  --radius:14px;
  --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.28);
  --shadow-md:0 6px 18px rgba(0,0,0,.3);
  --sidebar-w:250px;
}
body.light-theme{
  --bg:#F4F6FC;
  --surface:#FFFFFF;
  --surface-2:#F1F4FA;
  --border:#DFE4ED;
  --border-soft:#E9ECF3;
  --text:#16232E;
  --text-dim:#57626C;
  --text-faint:#828C95;
  --gold:#283ED6;
  --gold-soft:#E9EEFF;
  --pos:#1E8F58;
  --pos-soft:#E2F3EA;
  --neg:#C23B3B;
  --neg-soft:#F8E6E6;
  --warn:#B9791F;
  --warn-soft:#F7ECD8;
  --crit:#C23B3B;
  --info:#2C5C86;
  --info-soft:#E4EDF3;
  --purple:#7C5CD9;
  --purple-soft:#EEEAFC;
  --teal:#128C82;
  --teal-soft:#E1F5F3;
  --shadow-sm:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --shadow-md:0 8px 24px rgba(16,24,40,.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .2s ease,color .2s ease;}
h1,h2,h3,.num{font-family:var(--font-sans);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
.sidebar ::-webkit-scrollbar-thumb{background:rgba(130,150,255,.22);border-radius:0;}
.sidebar ::-webkit-scrollbar-track{background:transparent;}
.sidebar, .nav{scrollbar-color:rgba(130,150,255,.22) transparent;}

.app{display:flex;min-height:100vh;}
/* ---------- menu lateral: sempre azul, no claro e no escuro (identidade de marca) ---------- */
.sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,var(--sidebar-top) 0%,var(--sidebar-mid) 45%,var(--sidebar-bottom) 100%);border-right:none;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:50;transition:transform .25s ease;box-shadow:2px 0 18px rgba(10,20,60,.18);}
.brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.14);}
.brand-mark{display:flex;align-items:center;gap:10px;}
.brand-dot{width:9px;height:9px;border-radius:50%;background:#FFFFFF;box-shadow:0 0 10px rgba(255,255,255,.7);}
.brand-name{font-family:var(--font-sans);font-weight:700;font-size:16px;letter-spacing:.2px;color:#FFFFFF;}
.brand-logo{width:100%;max-width:190px;height:auto;display:block;}
.brand-sub{font-size:11.5px;color:rgba(255,255,255,.62);margin-top:8px;padding-left:0;}
.nav{flex:1;padding:14px 12px;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:9px;color:rgba(255,255,255,.78);text-decoration:none;font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:3px;border-left:none;user-select:none;transition:background .15s ease,color .15s ease;}
.nav-item:hover{background:rgba(255,255,255,.1);color:#FFFFFF;}
.nav-item.active{background:#FFFFFF;color:var(--primary);border-left:none;font-weight:700;box-shadow:0 2px 10px rgba(6,12,40,.22);}
.nav-icon{width:16px;text-align:center;font-size:14px;}
.nav-foot{margin:12px;padding:14px 16px;border-top:none;border-radius:12px;background:rgba(0,0,0,.16);font-size:11px;color:rgba(255,255,255,.65);}
.nav-foot b, .nav-foot strong{color:#FFFFFF;}

.main{margin-left:var(--sidebar-w);flex:1;min-width:0;padding:0 32px 60px;}
/* ---------- topbar: faixa azul cheia, largura total da área de conteúdo ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:0 -32px 22px;padding:20px 32px;background:linear-gradient(90deg,var(--primary-700),var(--primary));color:#FFFFFF;box-shadow:0 4px 16px rgba(20,31,99,.18);}
.page-title{font-size:21px;font-weight:700;color:#FFFFFF;}
.page-sub{color:rgba(255,255,255,.78);font-size:12.5px;margin-top:3px;}
.topbar-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;}
.btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:9px;font-size:12.8px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;font-family:var(--font-sans);transition:background .15s ease,border-color .15s ease,filter .15s ease;}
.btn:hover{border-color:var(--gold);}
.btn.primary{background:var(--secondary);color:#FFFFFF;border-color:var(--secondary);font-weight:700;}
.btn.primary:hover{filter:brightness(1.08);}
.btn.small{padding:5px 10px;font-size:12px;}
.topbar .btn{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.28);color:#FFFFFF;}
.topbar .btn:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.5);}
.topbar .btn.primary{background:#FFFFFF;color:var(--primary);border-color:#FFFFFF;}
.topbar .btn.primary:hover{background:#EAF0FF;filter:none;}
.topbar-avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:14px;color:#FFFFFF;flex:none;}
select.filter, input.filter, button.filter{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:9px;font-size:12.5px;font-family:var(--font-sans);}
#fileInput{display:none;}

/* filter bar */
.filterbar{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow-sm);}
.filterbar-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
.filterbar-group{display:flex;flex-direction:column;gap:5px;min-width:132px;}
.filterbar-group label{font-size:10.8px;color:var(--text-faint);font-weight:700;letter-spacing:.3px;}
.filterbar-group select, .filterbar-group input{width:100%;}
.filterbar-divider{width:1px;align-self:stretch;background:var(--border-soft);margin:0 2px;}
.view-toggle{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:3px;flex-wrap:wrap;}
.view-toggle button{background:transparent;border:none;color:var(--text-dim);padding:7px 12px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-sans);transition:background .15s ease,color .15s ease;}
.view-toggle button.active{background:var(--gold);color:#FFFFFF;}
.compare-badge-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;}

/* multi-select de categoria (incluir/excluir) */
.multi-filter{position:relative;}
.multi-filter-btn{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;}
.multi-filter-btn .mf-caret{font-size:9px;color:var(--text-faint);}
.multi-filter-btn.is-active{border-color:var(--gold);color:var(--gold);}
.multi-filter-panel{position:absolute;top:calc(100% + 6px);left:0;z-index:40;width:270px;background:var(--surface);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow-md);padding:12px;}
.mf-mode-toggle{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:3px;margin-bottom:9px;}
.mf-mode-toggle button{flex:1;background:transparent;border:none;color:var(--text-dim);padding:6px 8px;border-radius:6px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:var(--font-sans);}
.mf-mode-toggle button.active{background:var(--gold);color:#FFFFFF;}
.mf-hint{font-size:10.5px;color:var(--text-faint);margin-bottom:8px;line-height:1.4;}
.mf-search{width:100%;box-sizing:border-box;margin-bottom:8px;}
.mf-quick{display:flex;gap:6px;margin-bottom:8px;}
.mf-quick button{flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);padding:5px 6px;border-radius:7px;font-size:10.8px;font-weight:600;cursor:pointer;font-family:var(--font-sans);}
.mf-quick button:hover{color:var(--text);border-color:var(--gold);}
.mf-list{max-height:200px;overflow:auto;border:1px solid var(--border-soft);border-radius:8px;padding:4px 2px;}
.mf-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;}
.mf-list label.mf-item, .mf-list label.mf-item span{font-size:12.5px !important;color:var(--text) !important;font-weight:400 !important;letter-spacing:normal !important;}
.mf-item:hover{background:var(--surface-2);}
.mf-item input{margin:0;flex:none;}
.mf-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto;min-width:0;display:inline-block;}
.mf-item input[type="checkbox"]{width:15px;height:15px;flex:none;accent-color:var(--gold);}
.mf-empty{padding:10px;font-size:11.5px;color:var(--text-faint);text-align:center;}
.mf-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;}
.selection-chip{display:none;align-items:center;gap:8px;background:var(--gold-soft);border:1px solid var(--gold);color:var(--gold);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-top:10px;}
.selection-chip.active{display:inline-flex;}
.selection-chip button{background:none;border:none;color:var(--gold);cursor:pointer;font-weight:700;font-size:13px;}

.section{display:none;}
.section.active{display:block;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* ---------- KPIs: fundos suaves e diferentes por tipo de indicador ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin-bottom:24px;}
.kpi{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow-sm);}
.kpi-top{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.kpi-icon{width:28px;height:28px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#FFFFFF;background:var(--text-faint);}
.kpi-label{font-size:11.5px;color:var(--text-dim);font-weight:600;letter-spacing:.2px;}
.kpi-value{font-size:19px;font-weight:800;margin-top:2px;letter-spacing:-.2px;line-height:1.2;white-space:normal;word-break:break-word;}
.kpi-value.pos{color:var(--pos);}
.kpi-value.neg{color:var(--neg);}
.kpi-delta{font-size:11.5px;margin-top:7px;color:var(--text-faint);}
.kpi-delta.up{color:var(--pos);}
.kpi-delta.down{color:var(--neg);}
.kpi-pos{background:var(--pos-soft);border-color:transparent;}
.kpi-pos .kpi-icon{background:var(--pos);}
.kpi-neg{background:var(--neg-soft);border-color:transparent;}
.kpi-neg .kpi-icon{background:var(--neg);}
.kpi-info{background:var(--gold-soft);border-color:transparent;}
.kpi-info .kpi-icon{background:var(--primary);}
.kpi-purple{background:var(--purple-soft);border-color:transparent;}
.kpi-purple .kpi-icon{background:var(--purple);}
.kpi-teal{background:var(--teal-soft);border-color:transparent;}
.kpi-teal .kpi-icon{background:var(--teal);}
.kpi-warn{background:var(--warn-soft);border-color:transparent;}
.kpi-warn .kpi-icon{background:var(--warn);}
.kpi-crit{background:var(--neg-soft);border-color:transparent;}
.kpi-crit .kpi-icon{background:var(--crit);}
.kpi-neutral .kpi-icon{background:var(--text-faint);}

/* ---------- Painel Executivo: grade fixa, cards 100% uniformes ----------
   Colunas explícitas por faixa de largura (em vez de auto-fit fluido) para
   que os mesmos cards sempre caiam na mesma linha, e não reagrupem de forma
   imprevisível ao redimensionar. Todos os cards têm o mesmo padding e a
   mesma fonte, independente do tom (pos/neg/info/...) ou do tamanho do valor. */
.painel-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;align-items:stretch;}
.painel-grid .kpi{padding:15px 14px;display:flex;flex-direction:column;justify-content:center;min-height:104px;}
.painel-grid .kpi-top{margin-bottom:8px;}
.painel-grid .kpi-icon{width:26px;height:26px;font-size:12px;border-radius:8px;}
.painel-grid .kpi-label{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.painel-grid .kpi-value{font-size:15px;line-height:1.2;white-space:normal;word-break:break-word;}
.painel-grid .kpi-delta{display:none;} /* mantém todos os cards com a mesma altura */
@media (max-width:1680px){ .painel-grid{grid-template-columns:repeat(6,1fr);} }
@media (max-width:1240px){ .painel-grid{grid-template-columns:repeat(4,1fr);} }
@media (max-width:860px){ .painel-grid{grid-template-columns:repeat(3,1fr);} }
@media (max-width:560px){ .painel-grid{grid-template-columns:repeat(2,1fr);} }

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px;}
@media(max-width:1000px){.grid2,.grid3{grid-template-columns:1fr;}}

.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px 18px 14px;position:relative;box-shadow:var(--shadow-sm);}
.card-title{font-size:13.8px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:8px;}
.card-sub{font-size:11.5px;color:var(--text-faint);margin-bottom:12px;}
.chart-wrap{position:relative;height:230px;}
.chart-wrap.tall{height:300px;}
.clickable-hint{font-size:10.5px;color:var(--text-faint);margin-top:4px;}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:150px;color:var(--text-faint);text-align:center;padding:10px;}
.empty .glyph{width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:8px;opacity:.85;}
.empty .msg{font-size:12.5px;max-width:260px;}

.banner{display:flex;align-items:center;gap:13px;border:1px solid var(--border-soft);background:var(--surface-2);padding:14px 16px;border-radius:var(--radius);font-size:12.5px;color:var(--text-dim);margin-bottom:18px;box-shadow:var(--shadow-sm);}
.banner b{color:var(--text);}
.banner.accent{background:var(--gold-soft);border-color:transparent;}
.banner-icon{flex:none;width:34px;height:34px;border-radius:10px;background:var(--gold);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:15px;}
.banner-body{flex:1;min-width:200px;}

table{width:100%;border-collapse:collapse;font-size:12.8px;}
th{text-align:left;color:var(--text-faint);font-weight:700;font-size:11px;letter-spacing:.3px;padding:10px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;position:sticky;top:0;background:var(--surface);}
th:hover{color:var(--text);}
th.sorted{color:var(--gold);}
td{padding:10px;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
tr.data-row:hover{background:var(--surface-2);cursor:pointer;}
.tag{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;}
.tag.E{background:var(--pos-soft);color:var(--pos);}
.tag.S{background:var(--neg-soft);color:var(--neg);}
.badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:5px;}
.badge.ok{background:var(--pos-soft);color:var(--pos);}
.badge.warn{background:var(--warn-soft);color:var(--warn);}
.badge.crit{background:var(--neg-soft);color:var(--neg);}

.row-expand-icon{display:inline-block;font-size:10px;color:var(--text-faint);margin-right:7px;transition:transform .15s ease;}
tr.month-row.open .row-expand-icon{transform:rotate(90deg);color:var(--gold);}
tr.month-row.open{background:var(--surface-2);}
tr.month-detail-row{display:none;}
tr.month-detail-row.open{display:table-row;}
tr.month-detail-row td{padding:0;border-bottom:1px solid var(--border-soft);}
tr.month-detail-row:hover{background:transparent;}
.month-detail-wrap{max-height:280px;overflow:auto;padding:6px 16px 14px 34px;background:var(--surface-2);}
.month-detail-table{width:100%;border-collapse:collapse;font-size:12px;}
.month-detail-table th{position:static;background:transparent;padding:6px 8px;font-size:10.5px;border-bottom:1px solid var(--border-soft);}
.month-detail-table td{padding:6px 8px;white-space:nowrap;}
.month-detail-note{font-size:11px;color:var(--text-faint);padding:8px 8px 2px;}

.table-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.table-scroll{overflow:auto;max-height:560px;border:1px solid var(--border-soft);border-radius:var(--radius);}
.pagination{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12.5px;color:var(--text-dim);}
.pg-btns{display:flex;gap:6px;}
.pg-btns button{background:var(--surface-2);border:1px solid var(--border);color:var(--text);width:28px;height:28px;border-radius:7px;cursor:pointer;}
.pg-btns button:disabled{opacity:.35;cursor:default;}

.result-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-top:18px;padding-top:18px;border-top:1px solid var(--border-soft);}
.rs-card{background:var(--surface-2);border-radius:13px;padding:16px 18px;display:flex;flex-direction:column;gap:9px;border-left:4px solid var(--text-faint);box-shadow:var(--shadow-sm);transition:transform .14s ease,box-shadow .14s ease;}
.rs-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.rs-card.pos{border-left-color:var(--pos);}
.rs-card.neg{border-left-color:var(--neg);}
.rs-card.gold{border-left-color:var(--gold);}
.rs-top{display:flex;align-items:center;gap:9px;}
.rs-icon{width:27px;height:27px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#FFFFFF;background:var(--text-faint);}
.rs-icon.pos{background:var(--pos);}
.rs-icon.neg{background:var(--neg);}
.rs-icon.gold{background:var(--gold);}
.rs-label{font-size:11px;color:var(--text-faint);font-weight:700;letter-spacing:.4px;text-transform:uppercase;}
.rs-value{font-size:21.5px;font-weight:800;letter-spacing:-.3px;}
.app.mobile-mode .result-summary{grid-template-columns:repeat(2,1fr);gap:10px;}

.alert-list{display:flex;flex-direction:column;gap:10px;}
.alert-item{display:flex;gap:12px;padding:13px 16px;border-radius:11px;border:1px solid var(--border-soft);background:var(--surface-2);align-items:flex-start;box-shadow:var(--shadow-sm);}
.alert-item .lvl{font-size:15px;line-height:1.3;}
.alert-item .body b{display:block;font-size:13px;margin-bottom:2px;}
.alert-item .body span{font-size:12px;color:var(--text-dim);}
.alert-item.crit{border-left:3px solid var(--crit);}
.alert-item.warn{border-left:3px solid var(--warn);}
.alert-item.ok{border-left:3px solid var(--pos);}
.radar-note{font-size:12px;color:var(--text-faint);margin-top:10px;line-height:1.6;}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(10,16,40,.55);z-index:100;align-items:center;justify-content:center;}
.modal-bg.active{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:460px;max-width:92vw;max-height:80vh;overflow:auto;box-shadow:var(--shadow-md);}
.modal h3{margin-bottom:14px;font-size:15px;}
.modal .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:12.8px;gap:14px;}
.modal .row span:first-child{color:var(--text-faint);}
.modal .row span:last-child{text-align:right;font-weight:500;}
.modal-close{float:right;cursor:pointer;color:var(--text-faint);font-size:18px;}

.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
@media(max-width:1000px){.two-col{grid-template-columns:1fr;}}

/* drill-down */
.breadcrumb{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:12px;font-size:12.5px;}
.crumb{color:var(--text-dim);cursor:pointer;padding:4px 9px;border-radius:7px;background:var(--surface-2);border:1px solid var(--border);}
.crumb:hover{border-color:var(--gold);color:var(--text);}
.crumb.current{color:var(--gold);background:var(--gold-soft);border-color:var(--gold);cursor:default;}
.crumb-sep{color:var(--text-faint);}
.drill-row{cursor:pointer;}
.drill-row:hover{background:var(--surface-2);}
.drill-bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;width:100px;display:inline-block;vertical-align:middle;margin-right:8px;}
.drill-bar i{display:block;height:100%;background:var(--gold);}

.hamburger{display:none;}
@media(max-width:880px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;padding:0 16px 50px;}
  .topbar{margin:0 -16px 18px;padding:16px;}
  .hamburger{display:block;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#FFFFFF;width:36px;height:36px;border-radius:9px;cursor:pointer;margin-right:8px;}
}

/* ============================================================
   VERSÃO CELULAR — layout mobile completo, ativado pelo botão
   "Versão Celular" na topbar (independente da largura real da
   janela; funciona mesmo com o navegador maximizado no desktop).
   Especificidade de .app.mobile-mode vence os estilos padrão e
   os dos @media acima, então isso funciona em qualquer tamanho.
   ============================================================ */
.app.mobile-mode .sidebar{transform:translateX(-100%);}
.app.mobile-mode .sidebar.open{transform:translateX(0);width:min(82vw,280px);}
.app.mobile-mode .main{margin-left:0;padding:0 12px 60px;}
.app.mobile-mode .hamburger{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#FFFFFF;width:38px;height:38px;border-radius:9px;cursor:pointer;margin-right:8px;flex:none;}

.app.mobile-mode .topbar{margin:0 -12px 16px;padding:14px 12px;flex-direction:column;align-items:stretch;gap:12px;}
.app.mobile-mode .topbar>div:first-child{width:100%;}
.app.mobile-mode .page-title{font-size:17.5px;}
.app.mobile-mode .page-sub{font-size:11.5px;}
.app.mobile-mode .topbar-actions{width:100%;flex-direction:column;align-items:stretch;gap:8px;}
.app.mobile-mode .topbar-actions>*{width:100%;box-sizing:border-box;}
.app.mobile-mode .mode-toggle{width:100%;box-sizing:border-box;}
.app.mobile-mode .mode-toggle button{flex:1;padding:11px 6px;font-size:12px;}
.app.mobile-mode .topbar .btn{width:100%;justify-content:center;padding:13px 14px;font-size:13.5px;min-height:44px;}
.app.mobile-mode .topbar-avatar{display:none;}

.app.mobile-mode .filterbar{padding:14px;}
.app.mobile-mode .filterbar-row{flex-direction:column;align-items:stretch;gap:10px;}
.app.mobile-mode .filterbar-group{min-width:0;width:100%;}
.app.mobile-mode .filterbar-group select,
.app.mobile-mode .filterbar-group input,
.app.mobile-mode .multi-filter-btn{width:100%;min-height:42px;font-size:14.5px;box-sizing:border-box;}
.app.mobile-mode .multi-filter-panel{width:min(90vw,320px);left:0;right:auto;}
.app.mobile-mode .view-toggle{width:100%;box-sizing:border-box;}
.app.mobile-mode .view-toggle button{flex:1 1 auto;padding:10px 6px;font-size:11.5px;}

.month-filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
.month-chip{background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-sans);transition:background .15s ease,color .15s ease,border-color .15s ease;}
.month-chip:hover{border-color:var(--gold);color:var(--text);}
.month-chip.active{background:var(--gold);color:#FFFFFF;border-color:var(--gold);}
.app.mobile-mode .month-filter-bar{width:100%;}
.app.mobile-mode .month-chip{flex:1 1 auto;text-align:center;padding:9px 6px;font-size:11.5px;}
.app.mobile-mode .filterbar-group:has(#f_clear){width:auto;}
.app.mobile-mode #f_clear{width:auto;min-height:40px;}

.app.mobile-mode .kpi-grid{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px;}
.app.mobile-mode .painel-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
.app.mobile-mode .painel-grid .kpi{min-height:92px;}
.app.mobile-mode .painel-grid .kpi-value{font-size:14px;}
.app.mobile-mode .grid2,.app.mobile-mode .grid3,.app.mobile-mode .two-col{grid-template-columns:1fr;}
.app.mobile-mode .kpi{padding:13px 14px;}
.app.mobile-mode .kpi-value{font-size:16.5px;}
.app.mobile-mode .kpi-label{font-size:11px;}
.app.mobile-mode .card{padding:15px 14px 12px;}
.app.mobile-mode .chart-wrap{height:220px;}
.app.mobile-mode .chart-wrap.tall{height:260px;}

.app.mobile-mode table{min-width:640px;font-size:12.5px;}
.app.mobile-mode .table-toolbar{flex-direction:column;align-items:stretch;}
.app.mobile-mode .table-toolbar>*{width:100%;box-sizing:border-box;}

.app.mobile-mode .modal,
.app.mobile-mode .chart-modal{width:94vw;padding:18px;}
.app.mobile-mode .modal-close{font-size:23px;padding:6px 10px;}
.app.mobile-mode .chart-modal .chart-wrap{height:min(52vh,420px);}

.app.mobile-mode .pg-btns button{width:40px;height:40px;}
.app.mobile-mode .nav-item{padding:13px 14px;font-size:14.5px;}
.app.mobile-mode .brand-logo{max-width:150px;}

/* Modo Executivo x Modo Analista */
.mode-toggle{display:flex;gap:4px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.28);border-radius:9px;padding:3px;}
.mode-toggle button{background:transparent;border:none;color:rgba(255,255,255,.82);padding:7px 13px;border-radius:7px;font-size:12.2px;font-weight:700;cursor:pointer;font-family:var(--font-sans);white-space:nowrap;}
.mode-toggle button.active{background:#FFFFFF;color:var(--primary);}
.app.mode-executivo .sidebar{display:none;}
.app.mode-executivo .main{margin-left:0;}
.app.mode-executivo .filterbar{display:none;}
.exec-hint{font-size:11.5px;color:var(--text-faint);margin:-6px 0 16px;}
.insight-item .body span{white-space:pre-line;}

/* Impressão individual de gráfico em A4 paisagem */
.chart-actions{position:absolute;top:14px;right:14px;display:flex;gap:6px;z-index:2;}
.chart-icon-btn{width:27px;height:27px;border-radius:7px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;line-height:1;}
.chart-icon-btn:hover{border-color:var(--gold);color:var(--gold);}
.chart-modal{width:min(1040px,94vw);}
.table-modal{width:min(1180px,96vw);max-height:94vh;}
.table-modal .table-scroll{max-height:none;overflow:visible;border:none;border-radius:0;}

/* --- Parametrizar categorias --- */
.cp-modal{width:min(720px,94vw);max-height:88vh;}
.cp-type-toggle{display:flex;gap:6px;margin-bottom:12px;}
.cp-type-toggle button{flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--border-soft);background:var(--surface-2);color:var(--text);font-size:12.6px;font-weight:700;cursor:pointer;}
.cp-type-toggle button.active{background:var(--gold);color:#FFFFFF;border-color:var(--gold);}
.cp-search{margin-bottom:10px;}
.cp-quick{display:flex;gap:10px;margin-bottom:10px;}
.cp-quick button{background:none;border:none;color:var(--gold);font-size:12px;font-weight:700;cursor:pointer;padding:0;}
.cp-list{max-height:min(48vh,420px);overflow:auto;border:1px solid var(--border-soft);border-radius:10px;}
.cp-row-wrap{border-bottom:1px solid var(--border-soft);}
.cp-row-wrap:last-child{border-bottom:none;}
.cp-row{display:flex;align-items:center;gap:10px;padding:10px 14px;}
.cp-row:hover{background:var(--surface-2);}
.cp-row input[type="checkbox"]{width:17px;height:17px;flex:none;cursor:pointer;}
.cp-row .cp-name{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cp-row .cp-tag{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:12px;flex:none;}
.cp-row .cp-tag.rec{background:var(--pos-soft);color:var(--pos);}
.cp-row .cp-tag.desp{background:var(--neg-soft);color:var(--neg);}
.cp-row .cp-valor{font-size:13px;font-weight:700;flex:none;min-width:110px;text-align:right;}
.cp-expand{flex:none;width:20px;height:20px;border:none;background:none;color:var(--text-faint);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:5px;transition:transform .15s ease;}
.cp-expand:hover{background:var(--surface-2);color:var(--text);}
.cp-expand.open{transform:rotate(90deg);}
.cp-fluxo-list{padding:2px 14px 10px 44px;background:var(--surface-2);}
.cp-fluxo-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--border-soft);cursor:pointer;}
.cp-fluxo-row:last-child{border-bottom:none;}
.cp-fluxo-row:hover{color:var(--text);}
.cp-fluxo-check{width:14px;height:14px;flex:none;cursor:pointer;}
.cp-fluxo-name{flex:1;font-size:12px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cp-fluxo-valor{font-size:12px;font-weight:700;flex:none;min-width:110px;text-align:right;}
.cp-fluxo-empty{padding:10px 0;font-size:12px;color:var(--text-faint);}
.cp-empty{padding:26px;text-align:center;color:var(--text-faint);font-size:13px;}
.cp-total{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:11px 14px;margin-top:-1px;background:var(--surface-2);border:1px solid var(--border-soft);border-top:none;border-radius:0 0 10px 10px;}
.cp-total .cp-total-label{font-size:12px;color:var(--text-faint);font-weight:700;}
.cp-total .cp-total-valor{font-size:16px;font-weight:800;}
.cp-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border-soft);}
.cp-footer .cp-count{font-size:12px;color:var(--text-faint);}
.cp-footer .cp-btns{display:flex;gap:8px;}
.table-modal h3{padding-right:26px;}

/* --- Tabela "Resultado mensal": colunas com cores fixas e bem definidas --- */
.result-table-wrap{border-radius:14px;overflow:hidden;border:1px solid var(--border-soft);box-shadow:var(--shadow-sm);}
table.result-table{border-collapse:separate;border-spacing:0;width:100%;font-size:14.5px;}
table.result-table th, table.result-table > tbody > tr.month-row > td, table.result-table tfoot td{border-right:2px solid rgba(0,0,0,.08);}
table.result-table th:last-child, table.result-table > tbody > tr.month-row > td:last-child, table.result-table tfoot td:last-child{border-right:none;}
table.result-table thead th{background:#B7BDC6;color:#000000;font-weight:800;font-size:13.5px;letter-spacing:.4px;padding:15px 16px;}
table.result-table tbody tr.month-row{cursor:pointer;transition:filter .12s ease,box-shadow .12s ease;}
table.result-table tbody tr.month-row td{padding:15px 16px;border-bottom:1px solid rgba(0,0,0,.08);font-size:14.5px;}
table.result-table tbody tr.month-row:hover{filter:brightness(.94);}
table.result-table tbody tr.month-row.open{box-shadow:inset 3px 0 0 var(--gold);}
table.result-table td.rt-mes{font-weight:800;font-size:15px;}
table.result-table tfoot td{background:#B7BDC6;color:#000000;padding:16px;font-weight:800;font-size:15px;}

/* Cor sólida por coluna (fixa, independente do tema claro/escuro) */
.rt-col-mes{background:#E7EAEE;color:#16232E;}
.rt-col-receitas{background:#CFE7FB;color:#16232E;}
.rt-col-antecip{background:#CDEFD6;color:#16232E;}
.rt-col-emprest{background:#FDE6C2;color:#16232E;}
.rt-col-despesas{background:#FBD4D4;color:#16232E;}
.rt-col-resultado-pos{background:#2E5FD9;color:#FFFFFF;}
.rt-col-resultado-neg{background:#C43C3C;color:#FFFFFF;}
.chart-modal .chart-wrap{height:min(64vh,560px);}
.chart-modal h3, .table-modal h3{display:flex;flex-direction:column;gap:2px;}
.chart-modal .chart-modal-sub, .table-modal .chart-modal-sub{font-size:12px;font-weight:400;color:var(--text-faint);}
.print-all-btn{display:flex;align-items:center;gap:6px;}
</style>
</head>

<script>
/* ============================================================
   1. CONFIG / NAV
   ============================================================ */
const PAGES = [
  {id:'painel', icon:'&#9635;', label:'Painel Executivo', sub:'Os indicadores mais importantes, em uma única tela'},
  {id:'diretoria', icon:'&#9679;', label:'Visão Geral', sub:'Visão executiva do caixa'},
  {id:'fluxo', icon:'&#8646;', label:'Fluxo de Caixa', sub:'Entradas, saídas e saldo'},
  {id:'receitas', icon:'&#8593;', label:'Receitas', sub:'Recebimentos e carteira de clientes'},
  {id:'despesas', icon:'&#8595;', label:'Despesas', sub:'Composição e evolução dos gastos'},
  {id:'clientes', icon:'&#9733;', label:'Clientes', sub:'Concentração e comportamento de recebimento'},
  {id:'tesouraria', icon:'&#9878;', label:'Tesouraria', sub:'Bancos, dívida e custo financeiro'},
  {id:'operacional', icon:'&#9881;', label:'Operacional', sub:'Matéria-prima, folha, fretes e perdas'},
  {id:'empresas', icon:'&#9632;', label:'Empresas', sub:'Comparativo entre empresas do grupo'},
  {id:'indicadores', icon:'&#8776;', label:'Indicadores', sub:'Índices e razões financeiras'},
  {id:'insights', icon:'&#9737;', label:'Insights Financeiros', sub:'Observações automáticas sustentadas pelos dados'},
  {id:'alertas', icon:'&#9888;', label:'Alertas', sub:'Radar automático de exceções'},
  {id:'parametrizar', icon:'&#9881;', label:'Parametrizar Categorias', sub:'Selecione o que entra nos cálculos — em tempo real, até salvar'},
  {id:'lancamentos', icon:'&#9776;', label:'Lançamentos', sub:'Base analítica completa'},
  {id:'config', icon:'&#9881;', label:'Configurações', sub:'Fonte de dados e mapeamento de colunas'},
];

/* ============================================================
   2. STATE
   ============================================================ */
let RAW = [];
let RECORDS = [];       // fully filtered (global filters + visão + crossfilter)
let COMPARE_RECORDS = []; // same filters/visão/crossfilter, comparison date window
let charts = {};
let lanState = {page:1, pageSize:25, sortKey:'data', sortDir:'desc', search:''};
let activePage = 'diretoria'; // página atualmente visível — usado por renderActive() para não recalcular as outras
let VIEW_MODE = 'analista'; // 'analista' | 'executivo'
let DRILL_STATE = {};   // per drill container: {path:[]}

const FILTERS = {
  periodo:'all',
  empresa:{mode:'all', values:[]}, natureza:{mode:'all', values:[]},
  banco:{mode:'all', values:[]}, categoria:{mode:'all', values:[]}, // mode: 'all' | 'include' | 'exclude'
  cliente:{mode:'all', values:[]}, departamento:{mode:'all', values:[]},
  fluxo:{mode:'all', values:[]}, // NOME_FLUXO — parametrizado via popup "Parametrizar categorias" (detalhe expandido)
  visao:'consolidada', compare:'none', compareStart:null, compareEnd:null,
};
/* ---------- sistema genérico de filtro multi-seleção (incluir só estas / todas, exceto estas) ---------- */
const MULTI_FILTERS = [
  {key:'empresa', label:'&#127970; Empresa', allLabel:'Todas as empresas', getValue:r=>empresaLabel(r.empresa)},
  {key:'natureza', label:'&#127991; Natureza', allLabel:'Todas as naturezas', getValue:r=>r.grupo1, dropEmpty:true},
  {key:'banco', label:'&#127974; Banco', allLabel:'Todos os bancos', getValue:r=>r.banco||'Não informado'},
  {key:'categoria', label:'&#127991; Categoria', allLabel:'Todas as categorias', getValue:r=>r.conta||'Outros'},
  {key:'cliente', label:'&#128101; Cliente/Fornecedor', allLabel:'Todos os clientes/fornecedores', getValue:r=>r.razao, dropEmpty:true},
  {key:'departamento', label:'&#128101; Departamento', allLabel:'Todos os departamentos', getValue:r=>r.departamento},
];
const multiFilterAll = {};   // key -> array de valores brutos disponíveis
const multiFilterDraft = {}; // key -> {mode, values:Set} — estado em edição, antes de "Aplicar"

function multiFilterHint(mode){
  return mode==='include'
    ? 'Marque as opções que você quer ver — as demais ficam de fora.'
    : 'Marque as opções que você quer tirar — todas as outras continuam aparecendo.';
}
function buildMultiFilterHTML(cfg){
  return `<label>${cfg.label}</label>
    <button type="button" class="filter multi-filter-btn" id="f_${cfg.key}_btn">
      <span id="f_${cfg.key}_label">${cfg.allLabel}</span><span class="mf-caret">&#9660;</span>
    </button>
    <div class="multi-filter-panel" id="f_${cfg.key}_panel" style="display:none;">
      <div class="mf-mode-toggle" id="f_${cfg.key}_mode">
        <button type="button" data-mode="include" class="active">Incluir só estas</button>
        <button type="button" data-mode="exclude">Todas, exceto estas</button>
      </div>
      <div class="mf-hint" id="f_${cfg.key}_hint">${multiFilterHint('include')}</div>
      <input type="text" class="filter mf-search" id="f_${cfg.key}_search" placeholder="Buscar...">
      <div class="mf-quick">
        <button type="button" id="f_${cfg.key}_marcar_todas">Marcar todas</button>
        <button type="button" id="f_${cfg.key}_desmarcar_todas">Desmarcar todas</button>
      </div>
      <div class="mf-list" id="f_${cfg.key}_list"></div>
      <div class="mf-footer">
        <button type="button" class="btn small" id="f_${cfg.key}_limpar">Limpar</button>
        <button type="button" class="btn small primary" id="f_${cfg.key}_aplicar">Aplicar</button>
      </div>
    </div>`;
}
function renderMultiList(cfg, filterText){
  const listEl = document.getElementById(`f_${cfg.key}_list`);
  const all = multiFilterAll[cfg.key] || [];
  const disp = v => cfg.displayValue ? cfg.displayValue(v) : v;
  const term = (filterText||'').trim().toLowerCase();
  const items = term ? all.filter(v=> String(disp(v)).toLowerCase().includes(term)) : all;
  if(!items.length){ listEl.innerHTML = `<div class="mf-empty">Nenhuma opção encontrada.</div>`; return; }
  const draft = multiFilterDraft[cfg.key];
  listEl.innerHTML = items.map((v,i)=>{
    const id = `mf_${cfg.key}_${i}`;
    const checked = draft.values.has(v) ? 'checked' : '';
    const nomeExibido = (disp(v) && String(disp(v)).trim()) ? disp(v) : '(sem nome)';
    return `<label class="mf-item" for="${id}"><input type="checkbox" id="${id}" data-val="${encodeURIComponent(v)}" ${checked}><span title="${nomeExibido}">${nomeExibido}</span></label>`;
  }).join('');

function updateMultiLabel(cfg){

function matchesFiltersExceptCategoria(r){
  for(const cfg of MULTI_FILTERS){
    if(cfg.key==='categoria') continue;
    const f = FILTERS[cfg.key];
    if(f && f.mode!=='all'){
      const v = cfg.getValue(r);
      const inList = f.values.includes(v);
      if(f.mode==='include' && !inList) return false;
      if(f.mode==='exclude' && inList) return false;
    }
  }
  if(FILTERS.visao!=='consolidada' && r.visao!==FILTERS.visao) return false;
  return true;
}
function categoryParamBaseline(){
  const cur = currentPeriodBounds();
  const map = new Map(); // categoria -> {valor, entrada, saida}
  if(!cur) return map;
  for(const r of RAW){
    if(r.data<cur.start || r.data>cur.end) continue;
    if(!matchesFiltersExceptCategoria(r)) continue;
    const fx = r.fluxo && r.fluxo.trim() ? r.fluxo : '(sem NOME_FLUXO)';
    if(!fluxoParamDraft.checked.has(fx)) continue;
    const cat = r.conta || 'Outros';
    if(!map.has(cat)) map.set(cat, {entrada:0, saida:0});
    const e = map.get(cat);
    if(isEntrada(r)) e.entrada += r.valor; else if(isSaida(r)) e.saida += r.valor;
  }
  return map;
}
function categoryParamFluxoBaseline(cat){
  const cur = currentPeriodBounds();
  const map = new Map(); // NOME_FLUXO -> {entrada, saida}
  if(!cur) return map;
  for(const r of RAW){
    if(r.data<cur.start || r.data>cur.end) continue;
    if((r.conta||'Outros')!==cat) continue;
    if(!matchesFiltersExceptCategoria(r)) continue;
    const fx = r.fluxo && r.fluxo.trim() ? r.fluxo : '(sem NOME_FLUXO)';
    if(!map.has(fx)) map.set(fx, {entrada:0, saida:0});
    const e = map.get(fx);
    if(isEntrada(r)) e.entrada += r.valor; else if(isSaida(r)) e.saida += r.valor;
  }
  return map;
}

  arr.sort((a,b)=> b.abs-a.abs);
  if(!arr.length){
    container.innerHTML = `<div class="cp-fluxo-empty">Nenhum lançamento com NOME_FLUXO para esta categoria, no período/filtros atuais.</div>`;
    return;

}

let cpVisibleCats = [];
function renderCategoryParamTable(){
  const baseline = categoryParamBaseline();
  const term = (document.getElementById('cp_search').value||'').trim().toLowerCase();
  let cats = [...baseline.keys()].map(c=>{
    const e = baseline.get(c);
    return {cat:c, entrada:e.entrada, saida:e.saida, absValor: e.entrada + e.saida};
  });
  // filtro por tipo é inclusivo: mostra a categoria sempre que ela tiver QUALQUER valor do tipo
  // selecionado — uma categoria com receita e despesa (ex.: antecipações) aparece nas duas visões,
  // em vez de ficar escondida numa delas. Isso é o que faz o total bater com os cards acima.
  if(catParamDraft.typeFilter==='receita') cats = cats.filter(x=> x.entrada>0);
  if(catParamDraft.typeFilter==='despesa') cats = cats.filter(x=> x.saida>0);
  if(term) cats = cats.filter(x=> x.cat.toLowerCase().includes(term));
  cats = cats.map(x=>{
    let valor, tipo;
    if(catParamDraft.typeFilter==='receita'){ valor = x.entrada; tipo = 'rec'; }
    else if(catParamDraft.typeFilter==='despesa'){ valor = -x.saida; tipo = 'desp'; }
    else { valor = x.entrada - x.saida; tipo = x.entrada>=x.saida ? 'rec' : 'desp'; }
    return {...x, valor, tipo};
  });
  cats.sort((a,b)=> b.absValor - a.absValor);
  cpVisibleCats = cats;
  const listEl = document.getElementById('cp_list');
  if(!cats.length){
    listEl.innerHTML = `<div class="cp-empty">Nenhuma categoria encontrada para este filtro/período.</div>`;
  }else{
    listEl.innerHTML = cats.map((x,i)=>{
      const id = `cp_row_${i}`;
      const checked = catParamDraft.checked.has(x.cat) ? 'checked' : '';
      const nome = x.cat && x.cat.trim() ? x.cat : '(sem nome)';
      const isOpen = cpExpandedCats.has(x.cat);
      return `<div class="cp-row-wrap">
        <label class="cp-row" for="${id}">
          <button type="button" class="cp-expand${isOpen?' open':''}" data-cat="${encodeURIComponent(x.cat)}" title="Ver detalhe por NOME_FLUXO">&#9656;</button>
          <input type="checkbox" class="cp-cat-check" id="${id}" data-val="${encodeURIComponent(x.cat)}" ${checked}>
          <span class="cp-name" title="${esc(nome)}">${esc(nome)}</span>
          <span class="cp-tag ${x.tipo}">${x.tipo==='rec'?'Receita':'Despesa'}</span>
          <span class="cp-valor">${money(x.valor)}</span>
        </label>
        <div class="cp-fluxo-list" data-cat-fluxo="${encodeURIComponent(x.cat)}" style="display:${isOpen?'block':'none'};"></div>
      </div>`;
    }).join('');
    listEl.querySelectorAll('.cp-cat-check').forEach(cb=>{
      cb.addEventListener('change', e=>{
        const v = decodeURIComponent(e.target.dataset.val);
        if(e.target.checked) catParamDraft.checked.add(v); else catParamDraft.checked.delete(v);
        updateCategoryParamCount();
        updateCategoryParamTotal();
        renderParamKpis();
      });
    });
    listEl.querySelectorAll('.cp-expand').forEach(btn=>{
      const cat = decodeURIComponent(btn.dataset.cat);
      if(cpExpandedCats.has(cat)){
        const box = listEl.querySelector(`.cp-fluxo-list[data-cat-fluxo="${btn.dataset.cat}"]`);
        if(box) renderCpFluxoList(cat, box);
      }
      btn.addEventListener('click', e=>{
        e.preventDefault(); e.stopPropagation();
        const box = listEl.querySelector(`.cp-fluxo-list[data-cat-fluxo="${btn.dataset.cat}"]`);
        const open = cpExpandedCats.has(cat);
        if(open){
          cpExpandedCats.delete(cat);
          btn.classList.remove('open');
          if(box) box.style.display = 'none';
        }else{
          cpExpandedCats.add(cat);
          btn.classList.add('open');
          if(box){ renderCpFluxoList(cat, box); box.style.display = 'block'; }
        }
      });
    });
  }
  updateCategoryParamCount();
  updateCategoryParamTotal();
  renderParamKpis();
}

/* findCol tenta casar o nome da coluna da planilha com os apelidos conhecidos,
   ignorando maiúsculas/acentos/espaços/underscores/hífen (1ª passada = igualdade
   exata depois de "limpar" os dois lados; 2ª passada = correspondência parcial,
   só para apelidos com 4+ caracteres, para tolerar nomes de coluna abreviados
   ou com texto extra, sem gerar falso-positivo em siglas curtas). */
const cleanHeader = s => norm(s).replace(/[^A-Z0-9]/g,'');
function findCol(headers, aliases){
  const H = headers.map(h=>({raw:h, clean:cleanHeader(h)}));
  for(const a of aliases){ const ac = cleanHeader(a); const hit = H.find(h=>h.clean===ac); if(hit) return hit.raw; }
  for(const a of aliases){
    const ac = cleanHeader(a); if(ac.length<4) continue;
    const hit = H.find(h=>h.clean.length>=4 && (h.clean.includes(ac) || ac.includes(h.clean)));
    if(hit) return hit.raw;
  }
  return null;
}
function excelDateToJS(v){
  if(v instanceof Date) return v;
  if(typeof v === 'number'){ return new Date(Math.round((v-25569)*86400*1000)); }
  if(typeof v === 'string'){ const d = new Date(v); if(!isNaN(d)) return d; }
  return null;
}
/* Datas em texto vêm em formatos bem diferentes conforme o ERP/planilha
   (dd/mm/aaaa, aaaa-mm-dd, dd-mm-aa, com ponto...). new Date(string) sozinho
   é ambíguo (interpreta como mm/dd/aaaa, formato dos EUA) e erraria a maioria
   das planilhas brasileiras — por isso os formatos mais comuns são
   reconhecidos explicitamente antes de cair no parser genérico do navegador. */
function parseDataBR(v){
  if(v==null || v==='') return null;
  if(v instanceof Date) return isNaN(v) ? null : v;
  if(typeof v === 'number') return excelDateToJS(v);
  const s = String(v).trim();
  let m;
  if((m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/))) return new Date(+m[1], +m[2]-1, +m[3]);
  if((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/))) return new Date(+m[3], +m[2]-1, +m[1]);
  if((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2})$/))){ let y=+m[3]; y += y<70?2000:1900; return new Date(y, +m[2]-1, +m[1]); }
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
/* Valores em texto variam entre "1.234,56" (padrão BR), "1234.56" (padrão
   EUA/planilha exportada em inglês), com "R$"/espaços/parênteses (negativo)
   na frente. Decide o separador decimal olhando qual símbolo aparece por
   último na string, em vez de assumir um único padrão fixo. */
function parseValorBR(v){
  if(v==null || v==='') return 0;
  if(typeof v === 'number') return v;
  let s = String(v).trim();
  if(!s) return 0;
  let neg = false;
  if(/^\(.*\)$/.test(s)){ neg = true; s = s.slice(1,-1); }
  if(/^-/.test(s.trim())) neg = true;
  s = s.replace(/[^\d,.\-]/g,'');
  const lastComma = s.lastIndexOf(','), lastDot = s.lastIndexOf('.');
  if(lastComma>-1 && lastDot>-1){
    if(lastComma>lastDot) s = s.replace(/\./g,'').replace(',', '.');
    else s = s.replace(/,/g,'');
  } else if(lastComma>-1){
    s = s.replace(/\./g,'').replace(',', '.');
  } else if(lastDot>-1){
    const decimals = s.length - lastDot - 1;
    if(decimals===3 && s.indexOf('.')!==lastDot) s = s.replace(/\./g,'');
  }
  let n = parseFloat(s);
  if(isNaN(n)) n = 0;
  return neg ? -Math.abs(n) : n;
}
/* Aceita vários jeitos de marcar entrada/saída além de "E"/"S": crédito/débito,
   receita/despesa, C/D, sinal por extenso... */
function normTipoValor(raw){
  if(raw==null || raw==='') return null;
  const t = norm(String(raw)).trim();
  if(t==='E' || t==='C' || /ENTRADA|RECEITA|CREDITO|CREDIT/.test(t)) return 'E';
  if(t==='S' || t==='D' || /SAIDA|DESPESA|DEBITO|DEBIT/.test(t)) return 'S';
  return null;
}
function classifyVisao(r){
  const s = r.conta+' '+r.historico;
  if(keywordMatch(s,KW.investimento)) return 'investimentos';
  if(keywordMatch(s,KW.transferencia)) return 'transferencias';
  if(keywordMatch(s,KW.emprestimo)||keywordMatch(s,KW.amortizacao)) return 'financiamento';
  if(keywordMatch(s,KW.juros)||keywordMatch(s,KW.tarifas)||keywordMatch(s,KW.antecipacao)) return 'financeira';
  return 'operacional';
}
function normalizeRows(rows){
  const out = [];
  if(!rows.length){ out.meta = {total:0, discarded:0, headers:[], missing:['data','valor']}; return out; }
  const headers = Object.keys(rows[0]);
  const map = {};
  for(const key in COLUMN_ALIASES) map[key] = findCol(headers, COLUMN_ALIASES[key]);
  const missing = [];
  if(!map.data) missing.push('data');
  if(!map.valor) missing.push('valor');
  const parsedAll = rows.map(r=>{
    const grupo1 = map.grupo1 ? String(r[map.grupo1]||'').trim().toUpperCase() : '';
    let tipo = map.tipo ? normTipoValor(r[map.tipo]) : null;
    if(!tipo){ tipo = grupo1.includes('DESPESA') ? 'S' : (grupo1.includes('RECEITA') ? 'E' : null); }
    const data = map.data ? parseDataBR(r[map.data]) : null;
    const rawValor = map.valor ? parseValorBR(r[map.valor]) : 0;
    if(!tipo){ tipo = rawValor<0 ? 'S' : (rawValor>0 ? 'E' : null); }
    const valor = Math.abs(rawValor);
    const rec = {
      empresa: esc(map.cod_empresa ? (r[map.cod_empresa] ?? 'N/D') : 'N/D'),
      fluxo: map.nome_fluxo ? esc(String(r[map.nome_fluxo]||'').trim()) : '',
      data, grupo1: esc(grupo1),
      grupo2: map.grupo2 ? esc(String(r[map.grupo2]||'').trim()) : '',
      conta: esc(map.conta ? String(r[map.conta]||'').trim() : (map.nome_fluxo? String(r[map.nome_fluxo]||'').trim():'')),
      tipo: tipo,
      historico: map.historico ? esc(String(r[map.historico]||'').trim()) : '',
      valor,
      origem: map.origem ? esc(String(r[map.origem]||'').trim()) : '',
      codigo: map.codigo ? esc(r[map.codigo]) : '',
      razao: map.razao ? esc(String(r[map.razao]||'').trim()) : '',
      cnpj: map.cnpj ? esc(String(r[map.cnpj]||'').trim()) : '',
      duplicata: map.duplicata ? esc(String(r[map.duplicata]||'').trim()) : '',
      banco: map.banco ? esc(String(r[map.banco]||'').trim()) : (map.nome_fluxo ? esc(String(r[map.nome_fluxo]||'').trim()) : ''),
      departamento: map.departamento ? esc(String(r[map.departamento]||'').trim()) : '',
    };
    if(!rec.departamento) rec.departamento = 'Não informado';
    rec.visao = classifyVisao(rec);
    return rec;
  });
  const records = parsedAll.filter(r=>r.data);
  records.forEach(r=>out.push(r));
  out.meta = {total: rows.length, discarded: rows.length - records.length, headers, missing, mapped: map};
  return out;
}
/* ---------- leitura tolerante de pasta de trabalho (múltiplas abas / cabeçalho fora da linha 1) ----------
   Nem toda planilha tem os dados prontos na primeira aba a partir da linha 1 — é comum haver uma aba de
   "capa"/instruções antes da aba de dados, ou linhas de título/logo acima do cabeçalho de verdade. As duas
   funções abaixo escolhem automaticamente a aba com mais linhas de dados e localizam a linha de cabeçalho
   dentro das primeiras 15 linhas dessa aba, em vez de assumir sempre "primeira aba, linha 1". */
function pickBestSheet(wb){
  let best = null, bestScore = -1;
  wb.SheetNames.forEach(name=>{
    let arr;
    try{ arr = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:null, blankrows:false}); }catch(e){ arr = []; }
    if(arr.length>bestScore){ bestScore = arr.length; best = {name, arr}; }
  });
  return best || {name:null, arr:[]};
}
function detectHeaderRow(arr){
  let bestIdx = 0, bestScore = -1;
  const limit = Math.min(arr.length, 15);
  for(let i=0;i<limit;i++){
    const row = arr[i]||[];
    const nonEmpty = row.filter(c=>c!=null && String(c).trim()!=='');
    if(!nonEmpty.length) continue;
    const strCells = nonEmpty.filter(c=>typeof c==='string' && isNaN(Number(c)));
    const score = strCells.length + nonEmpty.length*0.1;
    if(score>bestScore){ bestScore = score; bestIdx = i; }
  }
  return bestIdx;
}
function rowsFromSheet(wb){
  const {name, arr} = pickBestSheet(wb);
  if(!arr.length) return {rows:[], sheetName:name};
  const headerIdx = detectHeaderRow(arr);
  const headers = (arr[headerIdx]||[]).map((h,i)=> (h==null || String(h).trim()==='') ? `COLUNA_${i+1}` : String(h).trim());
  const rows = [];
  for(let i=headerIdx+1;i<arr.length;i++){
    const line = arr[i]; if(!line) continue;
    if(line.every(c=>c==null || String(c).trim()==='')) continue;
    const obj = {};
    headers.forEach((h,idx)=>{ obj[h] = line[idx]!==undefined ? line[idx] : null; });
    rows.push(obj);
  }
  return {rows, sheetName:name, headerRowIndex:headerIdx};
}
/* Mensagem de diagnóstico usada nos três pontos de carregamento quando a
   planilha não pôde ser reconhecida — em vez de "não foi possível", explica
   o que faltou e quais colunas foram encontradas, para o usuário conseguir
   corrigir o nome da coluna na origem em vez de adivinhar. */
function importFailureMessage(normalized, sheetName){
  const meta = normalized && normalized.meta || {};
  if(!meta.total) return 'A planilha está vazia ou não foi possível ler nenhuma linha dela.';
  const parts = [];
  if(meta.missing && meta.missing.length){
    parts.push(`Não encontrei uma coluna de ${meta.missing.map(m=>m==='data'?'DATA':'VALOR').join(' e de ')}.`);
  } else {
    parts.push(`Encontrei as colunas de data e valor, mas nenhuma linha tinha uma data reconhecível (${meta.total} linha(s) na aba${sheetName?` "${sheetName}"`:''}).`);
  }
  if(meta.headers && meta.headers.length) parts.push(`Colunas encontradas: ${meta.headers.join(', ')}.`);
  parts.push('Renomeie a coluna correspondente na planilha (ex.: "Data" ou "Valor") e carregue novamente — veja a lista de nomes reconhecidos em Configurações.');
  return parts.join(' ');
}

function isNaoClassificado(r){ return !isEntrada(r) && !isSaida(r); }

/* ============================================================
   CONFIGURAÇÃO COMPARTILHADA (Parametrizar Categorias)
   ------------------------------------------------------------
   A seleção salva em "Parametrizar Categorias" (categorias + NOME_FLUXO) é gravada
   num documento compartilhado do próprio painel (db do artefato: config/parametrizacao).
   Ao abrir em qualquer máquina/usuário com acesso, o painel lê esse documento e aplica
   a mesma configuração; quando alguém salva, todos os que estão com o painel aberto
   recebem a alteração na hora. Fora do link publicado (arquivo .html aberto direto do
   disco) o recurso compartilhado não existe — nesse caso a configuração fica só
   neste navegador (localStorage).
   ============================================================ */
const CFG_LS_KEY = 'painelfin_param_cfg_v1';
const CFG_DOC_PATH = 'config/parametrizacao';
let SHARED_CFG = null;       // última configuração conhecida {categoria, fluxo}
let SHARED_DOC = null;       // referência do documento compartilhado (null = indisponível)
let SHARED_CFG_STATUS = 'local'; // 'local' | 'shared' | 'readonly'
function cfgPart(p){
  return (p && ['all','include','exclude'].includes(p.mode) && Array.isArray(p.values))
    ? {mode:p.mode, values:p.values.map(String)} : {mode:'all', values:[]};
}
function cfgFromFilters(){ return {categoria:cfgPart(FILTERS.categoria), fluxo:cfgPart(FILTERS.fluxo)}; }
function cfgSig(c){
  const part = x=>[x.mode, [...x.values].sort()];
  return JSON.stringify([part(cfgPart(c.categoria)), part(cfgPart(c.fluxo))]);
}
/* Aplica uma configuração aos filtros globais. Retorna true se algo mudou. */
function applySharedCfg(cfg){
  if(!cfg) return false;
  const c = {categoria:cfgPart(cfg.categoria), fluxo:cfgPart(cfg.fluxo)};
  if(cfgSig(c) === cfgSig(cfgFromFilters())) return false;
  FILTERS.categoria = c.categoria; FILTERS.fluxo = c.fluxo;
  try{ const m = MULTI_FILTERS.find(x=>x.key==='categoria'); if(m) updateMultiLabel(m); }catch(e){}
  return true;
}
const CFG_FILE_NAME = 'painel_config.js';
const CFG_FILE_IDB_KEY = 'configFile';
/* Grava a configuração em painel_config.js (mesma pasta do painel, na rede). O arquivo é lido
   automaticamente ao abrir o HTML (via <script src>); a gravação usa a File System Access API:
   cada máquina escolhe o arquivo uma única vez (a escolha fica lembrada nesse navegador). */
async function writeConfigFile(cfg, forcePick){
  if(!('showSaveFilePicker' in window)) return 'unsupported';
  let h = null;
  if(!forcePick){ try{ h = await idbGet(CFG_FILE_IDB_KEY); }catch(e){ h = null; } }
  if(h){
    let perm = 'denied';
    try{
      perm = await h.queryPermission({mode:'readwrite'});
      if(perm!=='granted') perm = await h.requestPermission({mode:'readwrite'});
    }catch(e){ perm = 'denied'; }
    if(perm!=='granted') h = null;
  }
  if(!h){
    try{
      h = await window.showSaveFilePicker({suggestedName:CFG_FILE_NAME, types:[{description:'Configuração do painel', accept:{'text/javascript':['.js']}}]});
      try{ await idbSet(CFG_FILE_IDB_KEY, h); }catch(e){}
    }catch(e){ return 'cancelled'; }
  }
  try{
    const text = '/* Configuração do Painel Financeiro — gerada automaticamente em "Parametrizar Categorias". Não edite à mão. */\n'
      + 'window.__PAINEL_CONFIG__ = ' + JSON.stringify({categoria:cfg.categoria, fluxo:cfg.fluxo, atualizadoEm:new Date().toISOString()}, null, 2) + ';\n';
    const w = await h.createWritable(); await w.write(text); await w.close();
    return (h.name && h.name!==CFG_FILE_NAME) ? 'file-wrongname' : 'file';
  }catch(e){ console.warn('arquivo de configuração', e); return 'cancelled'; }
}
function saveSharedCfg(forcePick){
  const cfg = cfgFromFilters();
  SHARED_CFG = cfg;
  try{ localStorage.setItem(CFG_LS_KEY, JSON.stringify(cfg)); }catch(e){}
  if(!SHARED_DOC){
    return writeConfigFile(cfg, forcePick===true).then(st=>{ SHARED_CFG_STATUS = st==='file' ? 'file' : (st==='file-wrongname' ? 'wrongname' : 'local'); return SHARED_CFG_STATUS; });
  }
  return SHARED_DOC.set({categoria:cfg.categoria, fluxo:cfg.fluxo, atualizadoEm:new Date().toISOString()})
    .then(()=>{ SHARED_CFG_STATUS='shared'; return 'shared'; })
    .catch(e=>{ SHARED_CFG_STATUS='readonly'; console.warn('config compartilhada', e); return 'readonly'; });
}
function sharedCfgStatusText(){
  if(SHARED_CFG_STATUS==='shared') return 'Configuração compartilhada: ao salvar, vale para todos que abrem este painel.';
  if(SHARED_CFG_STATUS==='file') return 'Configuração gravada em ' + CFG_FILE_NAME + ' na pasta do painel: quem abrir este HTML a partir dessa pasta carrega a mesma configuração.';
  if(SHARED_CFG_STATUS==='wrongname') return 'Atenção: o arquivo precisa se chamar ' + CFG_FILE_NAME + ' e ficar na mesma pasta do HTML do painel, senão não será carregado automaticamente.';
  if(SHARED_CFG_STATUS==='readonly') return 'Você não tem permissão para gravar a configuração compartilhada — a alteração vale só para esta sessão.';
  return 'Ainda não há arquivo de configuração vinculado: ao clicar em "Salvar configuração", escolha ' + CFG_FILE_NAME + ' na pasta do painel (uma vez por máquina).';
}
async function initSharedConfig(){
  try{ const raw = localStorage.getItem(CFG_LS_KEY); if(raw) SHARED_CFG = JSON.parse(raw); }catch(e){}
  if(window.__PAINEL_CONFIG__){ SHARED_CFG = {categoria:cfgPart(window.__PAINEL_CONFIG__.categoria), fluxo:cfgPart(window.__PAINEL_CONFIG__.fluxo)}; SHARED_CFG_STATUS = 'file'; }
  if(!(window.claude && typeof window.claude.use==='function')) return;
  let db = null;
  try{ db = await window.claude.use('db'); }catch(e){ db = null; }
  if(!db) return;
  SHARED_DOC = db.doc(CFG_DOC_PATH);
  SHARED_CFG_STATUS = 'shared';
  SHARED_DOC.onSnapshot(snap=>{
    if(!snap.exists) return;
    const d = snap.data() || {};
    SHARED_CFG = {categoria:cfgPart(d.categoria), fluxo:cfgPart(d.fluxo)};
    try{ localStorage.setItem(CFG_LS_KEY, JSON.stringify(SHARED_CFG)); }catch(e){}
    if(!RAW.length) return; // ainda sem dados: será aplicada em finishLoad
    if(applySharedCfg(SHARED_CFG)){ applyFilters(); renderActive(); }
  }, e=>{ console.warn('config compartilhada (snapshot)', e); });
}

  document.getElementById('navFoot').innerHTML = `${RAW.length.toLocaleString('pt-BR')} lançamentos<br>${sourceLabel}`;

/* ============================================================
   PLANILHA PADRÃO (carregamento automático ao abrir)
   ------------------------------------------------------------
   Usa a File System Access API (Chrome/Edge/Opera) para lembrar QUAL arquivo
   o usuário escolheu como fonte padrão. O "handle" do arquivo é salvo no
   IndexedDB do navegador (não dá para guardar isso em localStorage). Toda vez
   que o painel é aberto nesse navegador, ele tenta reabrir esse mesmo arquivo
   sozinho e carregar os dados mais recentes salvos nele — sem precisar clicar
   em nada. O botão "Carregar planilha" continua funcionando normalmente a
   qualquer momento, para trocar de arquivo ou forçar uma atualização manual.
   Em navegadores sem suporte (Firefox, Safari), esse recurso fica indisponível
   e o painel funciona normalmente só com o botão manual.
   ============================================================ */
const hasFSAccess = 'showOpenFilePicker' in window;
const IDB_NAME='painelfin_db', IDB_STORE='handles', IDB_KEY='defaultFile';
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(key, val){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
  });
}
async function idbDelete(key){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error);
  });
}
function updateDefaultFileUI(name){
  document.querySelectorAll('.default-file-label').forEach(el=>{
    el.textContent = name ? `Planilha padrão atual: ${name}` : 'Nenhuma planilha padrão definida.';
  });
  document.querySelectorAll('.default-file-actions').forEach(el=>{ el.style.display = name ? 'flex' : 'none'; });
  const topBtn = document.getElementById('refreshDefaultBtn');
  if(topBtn) topBtn.style.display = name ? '' : 'none';
}
let pendingDefaultHandle = null; // guardado quando a leitura silenciosa falha por falta de permissão — precisa de 1 clique
async function loadFromHandle(handle, isManual, silentOnly=false){
  try{
    let perm = await handle.queryPermission({mode:'read'});
    if(perm!=='granted'){
      if(silentOnly) return false; // sem gesto do usuário aqui — pedir permissão agora falharia silenciosamente
      perm = await handle.requestPermission({mode:'read'});
    }
    if(perm!=='granted'){
      if(isManual) alert('Permissão de leitura não concedida para a planilha padrão. Tente novamente e permita o acesso quando o navegador perguntar.');
      return false;
    }
    const libOk = await window.__ensureLib('XLSX', window.__libSources.xlsx);
    if(!libOk){ if(isManual) alert('Biblioteca de leitura de planilhas (XLSX) não carregou.'); return false; }
    const file = await handle.getFile();
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    const {rows, sheetName} = rowsFromSheet(wb);
    const normalized = normalizeRows(rows);
    if(!normalized.length){ if(isManual) alert(importFailureMessage(normalized, sheetName)); return false; }
    RAW = normalized; crossFilter=null; pendingDefaultHandle=null;
    finishLoad(`Planilha padrão: ${file.name} — atualizado às ${new Date().toLocaleTimeString('pt-BR')}`);
    return true;
  }catch(err){
    console.error('loadFromHandle', err);
    if(isManual) alert('Erro ao ler a planilha padrão: '+err.message);
    return false;
  }
}
async function chooseDefaultFile(){
  if(!hasFSAccess){ alert('Esse recurso (planilha padrão com carregamento automático) funciona apenas em navegadores baseados em Chromium — Google Chrome, Microsoft Edge ou Opera. No seu navegador atual, use o botão "Carregar planilha" normalmente sempre que quiser atualizar os dados.'); return; }
  try{
    const [handle] = await window.showOpenFilePicker({types:[{description:'Planilhas', accept:{
      'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx'],
      'application/vnd.ms-excel':['.xls'],
      'text/csv':['.csv']
    }}]});
    await idbSet(IDB_KEY, handle);

/* ------------------------------------------------------------
   Busca automática, por fetch(), de um arquivo FIXO na MESMA pasta
   do HTML — sem exigir nenhum clique. Isso só funciona quando este
   arquivo é aberto por um servidor (http/https) ou em navegadores que
   permitem leitura de arquivos locais irmãos via file://. No Chrome,
   quando o HTML é aberto por duplo-clique (file://), essa leitura é
   bloqueada por segurança — nesse caso o painel cai automaticamente
   para o método "planilha padrão" (que exige 1 clique único, ver
   tryAutoLoadDefault acima) ou para a tela de carregamento manual.
   ------------------------------------------------------------ */
const DEFAULT_FILE_NAMES = ['FLUXO_FINANCEIRO.xlsx','FLUXO FINANCEIRO.xlsx','fluxo_financeiro.xlsx'];
async function tryAutoFetchDefaultFile(){
  const libOk = await window.__ensureLib('XLSX', window.__libSources.xlsx).catch(()=>false);
  if(!libOk) return false;
  for(const name of DEFAULT_FILE_NAMES){
    try{
      const res = await fetch(encodeURI(name), {cache:'no-store'});
      if(!res || !res.ok) continue;
      const buf = await res.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellDates:true});
      const {rows, sheetName} = rowsFromSheet(wb);
      const normalized = normalizeRows(rows);
      if(!normalized.length) continue;
      RAW = normalized; crossFilter=null;
      finishLoad(`${name} (mesma pasta do painel) — carregado automaticamente às ${new Date().toLocaleTimeString('pt-BR')}`);
      return true;
    }catch(e){ /* file:// bloqueado, CORS, ou arquivo ausente com esse nome — tenta o próximo */ }
  }
  return false;
}
function opts(list, allLabel){
  return `<option value="all">${allLabel}</option>` + list.map(v=>`<option value="${encodeURIComponent(v)}">${v}</option>`).join('');
}
function populateFilterOptions(){

  document.getElementById('companyTag').textContent = empresasRaw.length>1 ? `Grupo · ${empresasRaw.length} empresas` : empresaLabel(empresasRaw[0]);
  MULTI_FILTERS.forEach(cfg=>{
    let vals = [...new Set(RAW.map(cfg.getValue))];
    if(cfg.dropEmpty) vals = vals.filter(Boolean);
    if(cfg.fixedOrder) vals = cfg.fixedOrder.filter(v=> vals.includes(v));
    else{
      const disp = v => cfg.displayValue ? cfg.displayValue(v) : v;
      vals.sort((a,b)=> String(disp(a)).localeCompare(String(disp(b)), 'pt-BR'));
    }
    multiFilterAll[cfg.key] = vals;

    updateMultiLabel(cfg);
  });
}

/* ============================================================
   4. FILTERING ENGINE
   ============================================================ */
function matchesFilters(r, opts_={}){
  const skipPeriodo = opts_.skipPeriodo;
  for(const cfg of MULTI_FILTERS){
    const f = FILTERS[cfg.key];
    if(f && f.mode!=='all'){
      const v = cfg.getValue(r);
      const inList = f.values.includes(v);
      if(f.mode==='include' && !inList) return false;
      if(f.mode==='exclude' && inList) return false;
    }
  }
  if(FILTERS.fluxo && FILTERS.fluxo.mode!=='all'){
    const fx = r.fluxo && r.fluxo.trim() ? r.fluxo : '(sem NOME_FLUXO)';
    const inList = FILTERS.fluxo.values.includes(fx);
    if(FILTERS.fluxo.mode==='include' && !inList) return false;
    if(FILTERS.fluxo.mode==='exclude' && inList) return false;
  }
  if(FILTERS.visao!=='consolidada' && r.visao!==FILTERS.visao) return false;
  if(crossFilter){
    const cf = crossFilter;
    if(cf.dim==='mes' && monthKey(r.data)!==cf.value) return false;
    if(cf.dim==='empresa' && empresaLabel(r.empresa)!==cf.value) return false;
    if(cf.dim==='conta' && (r.conta||'Outros')!==cf.value) return false;
    if(cf.dim==='razao' && (r.razao||'Não identificado')!==cf.value) return false;
    if(cf.dim==='banco' && (r.banco||'Não informado')!==cf.value) return false;
  }
  return true;
}
function currentPeriodBounds(){
  const scoped = RAW.filter(r=>matchesFilters(r,{skipPeriodo:true}));
  if(!scoped.length) return null;
  let max = scoped.reduce((m,r)=> r.data>m? r.data:m, scoped[0].data);
  if(FILTERS.periodo==='all'){
    let min = scoped.reduce((m,r)=> r.data<m? r.data:m, scoped[0].data);
    return {start:min, end:max};
  }
  const days = parseInt(FILTERS.periodo,10);
  const start = new Date(max.getTime()-days*86400*1000);
  return {start, end:max};
}
function compareBounds(cur){
  if(!cur) return null;
  const oneDay = 86400*1000;
  const spanDays = Math.max(1, Math.round((cur.end-cur.start)/oneDay));
  switch(FILTERS.compare){
    case 'anterior': {
      const end = new Date(cur.start.getTime()-oneDay);
      const start = new Date(end.getTime()-spanDays*oneDay);
      return {start,end};
    }
    case 'mes_anterior': {
      const y=cur.end.getFullYear(), m=cur.end.getMonth();
      const start = new Date(y, m-1, 1);
      const end = new Date(y, m, 0, 23,59,59);
      return {start,end};
    }
    case 'ano_periodo': {
      const start = new Date(cur.start.getFullYear()-1, cur.start.getMonth(), cur.start.getDate());
      const end = new Date(cur.end.getFullYear()-1, cur.end.getMonth(), cur.end.getDate(),23,59,59);
      return {start,end};
    }
    case 'ano_anterior': {
      const y = cur.end.getFullYear()-1;
      return {start:new Date(y,0,1), end:new Date(y,11,31,23,59,59)};
    }
    case 'custom': {
      if(!FILTERS.compareStart||!FILTERS.compareEnd) return null;
      return {start:new Date(FILTERS.compareStart), end:new Date(FILTERS.compareEnd+'T23:59:59')};
    }
    default: return null;
  }
}
function applyFilters(){
  const cur = currentPeriodBounds();
  if(cur){
    RECORDS = RAW.filter(r=> matchesFilters(r) && r.data>=cur.start && r.data<=cur.end);
  } else { RECORDS = []; }
  if(FILTERS.compare!=='none'){
    const cmp = compareBounds(cur);
    COMPARE_RECORDS = cmp ? RAW.filter(r=> matchesFilters(r) && r.data>=cmp.start && r.data<=cmp.end) : [];
  } else { COMPARE_RECORDS = []; }
  updateSelectionChip();
}
function updateSelectionChip(){
  const chip = document.getElementById('selectionChip');
  if(crossFilter){
    const dimLabel = {mes:'Mês', empresa:'Empresa', conta:'Categoria', razao:'Cliente/Fornecedor', banco:'Banco'}[crossFilter.dim] || crossFilter.dim;
    document.getElementById('selectionChipText').textContent = `Seleção ativa: ${dimLabel} = ${crossFilter.value}`;
    chip.classList.add('active');
  } else { chip.classList.remove('active'); }
  renderMonthFilterBar();
}
function renderMonthFilterBar(){
  const wrap = document.getElementById('monthFilterBar');
  if(!wrap) return;
  const months = sortedMonths(RAW);
  const mesAtivo = (crossFilter && crossFilter.dim==='mes') ? crossFilter.value : null;

    + months.map(m=>`<button type="button" class="month-chip${mesAtivo===m?' active':''}" data-mes="${m}">${monthLabel(m)}</button>`).join('');
}

function setCrossFilter(dim, value){
  if(crossFilter && crossFilter.dim===dim && crossFilter.value===value){ crossFilter=null; }
  else { crossFilter = {dim, value}; }

}

/* ---------- comparison helper ---------- */
/* (cur-prev)/prev inverte o sinal quando "prev" é negativo: uma melhora real de -100 para +50
   apareceria como "queda de 150%". Dividir pelo valor absoluto da base preserva a direção real
   da variação (positivo = melhorou, negativo = piorou), que é o que o usuário espera do sinal. */
function growth(cur, prev){ if(!prev) return null; return (cur-prev)/Math.abs(prev); }
function compareBadge(curVal, prevSet, sumFn, invertGood){
  if(FILTERS.compare==='none' || !prevSet.length) return '';
  const prevVal = sumFn(prevSet);
  const g = growth(curVal, prevVal);
  if(g==null) return '';
  const isUp = g>=0;
  const good = invertGood ? !isUp : isUp;
  const cls = good?'up':'down';
  const arrow = isUp?'&#9650;':'&#9660;';
  return `<div class="kpi-delta ${cls}">${arrow} ${pct(Math.abs(g))} vs. comparação</div>`;
}

document.getElementById('uploadBtn').addEventListener('click', ()=> document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', async function(e){
  const file = e.target.files[0]; if(!file) return;
  const uploadBtn = document.getElementById('uploadBtn');
  const originalLabel = uploadBtn.innerHTML;
  uploadBtn.innerHTML = 'Carregando…'; uploadBtn.disabled = true;
  const libOk = await window.__ensureLib('XLSX', window.__libSources.xlsx);
  if(!libOk){
    uploadBtn.innerHTML = originalLabel; uploadBtn.disabled = false;
    alert('Não foi possível carregar a biblioteca de leitura de planilhas (XLSX): nem do arquivo local (vendor/xlsx.full.min.js), nem das CDNs cdnjs, jsDelivr ou unpkg. Isso costuma acontecer quando a rede/firewall/antivírus está bloqueando essas CDNs ou quando não há conexão com a internet. Tente novamente, teste em outra rede (ex.: dados móveis), ou copie o arquivo xlsx.full.min.js para a pasta "vendor/" ao lado deste HTML (veja o comentário no topo do arquivo) para funcionar 100% offline.');
    e.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(evt){
    try{
      const wb = XLSX.read(evt.target.result, {type:'binary', cellDates:true});
      const {rows, sheetName} = rowsFromSheet(wb);
      const normalized = normalizeRows(rows);
      if(!normalized.length){ alert(importFailureMessage(normalized, sheetName)); return; }
      RAW = normalized; crossFilter=null;
      const meta = normalized.meta || {};
      const discardedTxt = meta.discarded ? ` — ${meta.discarded.toLocaleString('pt-BR')} linha(s) ignorada(s) por não ter data reconhecível` : '';
      finishLoad(`Planilha carregada: ${file.name}${wb.SheetNames.length>1?` (aba "${sheetName}")`:''} (${normalized.length.toLocaleString('pt-BR')} lançamentos${discardedTxt})`);
    }catch(err){ alert('Erro ao ler o arquivo: '+err.message); }
    finally{ uploadBtn.innerHTML = originalLabel; uploadBtn.disabled = false; e.target.value = ''; }
  };
  reader.onerror = function(){ uploadBtn.innerHTML = originalLabel; uploadBtn.disabled = false; alert('Não foi possível ler o arquivo selecionado.'); };
  reader.readAsBinaryString(file);
});
